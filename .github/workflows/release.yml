# Builds Treering for Windows and Linux. A version tag (v1.2.3) publishes the builds as a GitHub
# release anyone can download; running it by hand only builds them, to check a branch.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # The tests are written against Windows paths in places; they run where the tool is used most.
      - name: Test
        if: matrix.rid == 'win-x64'
        run: dotnet test tests/Treering.Core.Tests -c Release

      - name: Publish
        run: >
          dotnet publish src/Treering.Cli -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o out

      - name: Package (Windows)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item out/Treering.Cli.exe dist/treering.exe
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md dist/
          Compress-Archive -Path dist/* -DestinationPath treering-win-x64.zip

      - name: Package (Linux)
        if: matrix.rid == 'linux-x64'
        run: |
          mkdir dist
          cp out/Treering.Cli dist/treering
          chmod +x dist/treering
          cp LICENSE THIRD-PARTY-NOTICES.md dist/
          tar -czf treering-linux-x64.tar.gz -C dist .

      # The Linux build is not tested above, so it is started for real: the sample project is
      # made, the server comes up, and the page and a blueprint answer.
      - name: Smoke test (Linux)
        if: matrix.rid == 'linux-x64'
        run: |
          export TREERING_HOME="$RUNNER_TEMP/home"
          ./dist/treering sample
          ./dist/treering serve --no-watch --port 7390 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:7390/api/projects > /dev/null && break; sleep 1; done
          curl -fs http://127.0.0.1:7390/ | grep -q 'Treering'
          curl -fs http://127.0.0.1:7390/api/blueprint | grep -q 'Acme.Shop'
          curl -fs "http://127.0.0.1:7390/api/blueprint?die=1" | grep -q '"lines"'

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: treering-${{ matrix.rid }}.*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Checksums
        run: cd assets && sha256sum treering-* > SHA256SUMS

      # The release notes are the tag's own message - the release merge that made it.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force --tags
          gh release create "$GITHUB_REF_NAME" assets/* --title "$GITHUB_REF_NAME" --notes-from-tag
