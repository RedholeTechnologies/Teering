<style>
  :root {
    --bg: #faf9f7; --panel: #ffffff; --line: #e3e0d8;
    --fg: #2c2c2a; --muted: #6f6d66; --warn: #854f0b; --warn-bg: #faeeda;
    --born: #2f8f4e; --died: #b4453f;
    --depth: #ffffff; --accent: #6d4fe0;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) {
    color-scheme: dark;
      --bg: #1a1a18; --panel: #242422; --line: #3a3a36;
      --fg: #eceae4; --muted: #9b998f; --warn: #fac775; --warn-bg: #3a2c12;
      --born: #67c98a; --died: #e07b74; --depth: #1a1a18; --accent: #a88bff;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #1a1a18; --panel: #242422; --line: #3a3a36;
    --fg: #eceae4; --muted: #9b998f; --warn: #fac775; --warn-bg: #3a2c12;
    --born: #67c98a; --died: #e07b74; --depth: #1a1a18; --accent: #a88bff;
  }
  /* Slate: drawn from ui-ux-pro-max's system for developer tools - slate ground, "run" green
     accent, a code face for names and a humanist sans for the chrome. The fonts are used when
     they are installed and never fetched: Treering makes no network calls, and a page that
     pulled Google Fonts would. Low white emission - the text is slate-200, not white. */
  :root[data-theme="slate"] {
    color-scheme: dark;
    --bg: #0f172a; --panel: #1b2336; --line: #334155;
    --fg: #e2e8f0; --muted: #94a3b8; --warn: #fbbf24; --warn-bg: #2a2413;
    --born: #4ade80; --died: #f87171; --depth: #0f172a; --accent: #22c55e;
  }
  :root[data-theme="slate"] body {
    font-family: "IBM Plex Sans", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  }
  :root[data-theme="slate"] .label,
  :root[data-theme="slate"] #panel code, :root[data-theme="slate"] #panel .sig,
  :root[data-theme="slate"] #hits b {
    font-family: "JetBrains Mono", "Cascadia Code", "Cascadia Mono", Consolas, ui-monospace, monospace;
  }

  /* Obsidian's graph view: flat charcoal, plain dots, hairline links, a violet accent. */
  :root[data-theme="obsidian"] {
    color-scheme: dark;
    --bg: #1e1e1e; --panel: #262626; --line: #363636;
    --fg: #dcddde; --muted: #8b8b8b; --warn: #e0c47a; --warn-bg: #3a3222;
    --born: #7ec699; --died: #e06c75; --depth: #1e1e1e; --accent: #a882ff; --edge: #6e6e6e;
  }
  :root[data-theme="obsidian"] body,
  :root[data-theme="obsidian"] .label {
    font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  /* Q branch. Dark navy, a faint grid, glowing filaments. */
  :root[data-theme="skyfall"] {
    color-scheme: dark;
    --bg: #04090f; --panel: #060e18; --line: #10283f;
    --fg: #cfe9f7; --muted: #5d8bab; --warn: #7fd7ff; --warn-bg: #08202f;
    --born: #58e0a8; --died: #ff7a6b; --depth: #04090f; --accent: #ffd166;
  }
  :root[data-theme="skyfall"] #stage {
    background-color: #04090f;
    background-image:
      linear-gradient(rgba(64,160,210,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(64,160,210,0.06) 1px, transparent 1px),
      radial-gradient(ellipse at 50% 45%, rgba(40,120,170,0.18), transparent 64%);
    background-size: 46px 46px, 46px 46px, 100% 100%;
  }
  :root[data-theme="skyfall"] .label {
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 14px/1.5 -apple-system, "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  header, footer {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 16px; background: var(--panel);
  }
  /* One bar. What you reach for all the time sits on it - where you are, search, the shape,
     our code or everything. What you set now and then folds into three small menus: time,
     view, and settings. */
  header {
    border-bottom: 1px solid var(--line); flex-wrap: nowrap; gap: 6px;
    padding: 8px 10px 8px 14px; min-height: 52px; box-sizing: border-box; position: relative; z-index: 15;
  }
  .brand-name { font-weight: 650; letter-spacing: -0.01em; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  header .icon {
    width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor;
    stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
  }
  #projectBox { margin-left: 6px; }
  #projectBox select {
    font-weight: 600; background: transparent; border-color: transparent; border-radius: 8px;
    height: 32px; padding: 0 8px; max-width: 260px; cursor: pointer;
  }
  #projectBox select:hover { background: color-mix(in srgb, var(--fg) 7%, transparent); }
  /* The open list takes its colours from the select. This one is transparent to sit in the
     bar, and Windows paints a transparent list white - under the theme's pale text. Every list
     gets the panel's colours outright. */
  select option, select optgroup { background-color: var(--panel); color: var(--fg); }
  header .where {
    display: flex; align-items: center; gap: 2px; min-width: 0; flex: 0 1 auto;
    padding-left: 8px; margin-left: 2px; border-left: 1px solid var(--line);
  }
  #crumbs { min-width: 0; overflow: hidden; white-space: nowrap; }
  header .icon-btn, header .tool {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; flex: none;
    height: 32px; border-radius: 8px; border: 1px solid transparent; background: transparent;
    color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; padding: 0 10px;
  }
  header .icon-btn, header .tool.icon-only { width: 32px; padding: 0; }
  header .icon-btn:hover:not(:disabled), header .tool:hover, header .tool[aria-expanded="true"] {
    background: color-mix(in srgb, var(--fg) 8%, transparent); color: var(--fg);
  }
  header .icon-btn:disabled { opacity: 0.35; cursor: default; }
  header .tool .icon:last-child:not(:first-child) { width: 12px; height: 12px; }
  #search { flex: 0 1 340px; min-width: 140px; }
  #q { width: 100%; box-sizing: border-box; height: 32px; padding: 0 10px; border-radius: 8px; }
  header .tools { display: flex; align-items: center; gap: 6px; flex: none; }

  /* The shape: five icons, one of them on. It is a choice among five, so it reads as one. */
  .segmented {
    display: inline-flex; gap: 2px; padding: 2px; border-radius: 10px;
    background: color-mix(in srgb, var(--fg) 6%, transparent);
  }
  .segmented button {
    width: 30px; height: 28px; display: grid; place-items: center; border: none; border-radius: 8px;
    background: none; color: var(--muted); cursor: pointer;
  }
  .segmented button:hover { color: var(--fg); }
  .segmented button[aria-checked="true"] {
    background: var(--panel); color: var(--accent);
    box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(0, 0, 0, 0.16);
  }

  /* Our code or everything: a switch, so it says which way it is at a glance. */
  .toggle {
    display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; flex: none;
    border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--muted);
    font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .toggle::before {
    content: ""; width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid currentColor; flex: none;
  }
  .toggle:hover { color: var(--fg); }
  .toggle[aria-pressed="true"] {
    color: var(--fg); border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
    background: color-mix(in srgb, var(--accent) 10%, transparent);
  }
  .toggle[aria-pressed="true"]::before { background: var(--accent); border-color: var(--accent); }

  .pop { position: relative; flex: none; }
  #timeLabel { color: var(--fg); font-variant-numeric: tabular-nums; }
  .menu {
    position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; min-width: 260px;
    display: grid; gap: 10px; padding: 12px; box-sizing: border-box;
    background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.28), 0 2px 6px rgba(0, 0, 0, 0.12);
    transform-origin: top right;
    transition: opacity 150ms var(--ease-out, ease-out), transform 150ms var(--ease-out, ease-out);
  }
  .menu[hidden] { display: none; }
  @starting-style { .menu { opacity: 0; transform: scale(0.97) translateY(-2px); } }
  .menu label {
    display: grid; grid-template-columns: 76px minmax(0, 1fr); align-items: center; gap: 10px;
    font-size: 13px; color: var(--muted);
  }
  .menu label[hidden] { display: none; }
  /* A switch row: the box, then what it does and when it last did it. */
  .menu label.check {
    grid-template-columns: 16px minmax(0, 1fr); align-items: start; cursor: pointer;
    padding-top: 8px; border-top: 1px solid var(--line);
  }
  .menu label.check input { margin: 2px 0 0; width: 14px; height: 14px; accent-color: var(--accent); }
  .menu label.check b { display: block; font-weight: 600; color: var(--fg); }
  .menu label.check small { display: block; margin-top: 2px; font-size: 12px; color: var(--muted); }
  .menu select { width: 100%; min-width: 0; height: 32px; border-radius: 8px; }
  .menu .narrow-only { display: none; }
  @media (max-width: 1180px) { #timeLabel, .brand-name { display: none; } }
  @media (max-width: 940px) {
    #shapes, #ownToggle { display: none; }
    .menu .narrow-only { display: grid; }
  }
  @media (prefers-reduced-motion: reduce) {
    @starting-style { .menu { transform: none; } }
  }
  /* The mark: a sawn log's end - uneven rings round an off-centre pith, a drying crack from
     the bark inward, and the outermost ring, now, in the theme's accent. */
  .brand { display: inline-flex; align-items: center; gap: 7px; }
  .mark { width: 20px; height: 20px; flex: none; }
  .mark path { fill: none; stroke: var(--muted); stroke-width: 1.05; }
  .mark path.bark { stroke: var(--accent); stroke-width: 2.2; }
  .mark mask path { fill: #000; stroke: none; }
  .mark .pith { fill: var(--fg); }
  footer { border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  #crumbs { display: flex; align-items: center; gap: 6px; }
  #search { position: relative; }
  /* Importing. Opened from the project menu it is a dialog over the map; with nothing imported
     yet it is the whole first screen, drawn beside the rings the tool is named for. One form,
     four states: choosing a folder, waiting on the folder window, importing, and stopped. */
  #importer {
    position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center;
    background: color-mix(in srgb, #000 45%, transparent); padding: 16px;
  }
  #importer[hidden] { display: none; }
  #importer .box {
    width: min(540px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; overscroll-behavior: contain;
    background: var(--panel); color: var(--fg);
    border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px 22px;
    box-shadow: 0 24px 64px rgba(0, 0, 0, 0.35), 0 2px 6px rgba(0, 0, 0, 0.12);
  }
  /* Korean breaks between words, not inside them. */
  #importer .form { word-break: keep-all; overflow-wrap: anywhere; }
  #importer .icon {
    width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor;
    stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
  }
  #importer .head { display: flex; align-items: flex-start; gap: 12px; }
  #importer h2 { flex: 1; margin: 0; font-size: 18px; font-weight: 650; line-height: 1.3; text-wrap: balance; }
  #importer .close {
    margin: -4px -6px 0 0; width: 32px; height: 32px; display: grid; place-items: center; flex: none;
    border: none; border-radius: 8px; background: none; color: var(--muted); cursor: pointer;
  }
  #importer .close:hover { background: color-mix(in srgb, var(--fg) 8%, transparent); color: var(--fg); }
  #importer .lead { display: none; }
  #rings { display: none; }

  #importer .choose, #importer .progress { display: none; margin-top: 16px; }
  #importer[data-state="idle"] .choose, #importer[data-state="picking"] .choose { display: block; }
  #importer[data-state="running"] .progress, #importer[data-state="failed"] .progress { display: block; }

  /* The one thing to press: a folder, and what will happen to it. */
  #importer .pick {
    width: 100%; display: flex; align-items: center; gap: 14px; text-align: left;
    padding: 14px 16px; border-radius: 12px; cursor: pointer; font: inherit; color: var(--fg);
    background: color-mix(in srgb, var(--accent) 7%, var(--panel));
    border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--line));
    transition: background-color 150ms ease-out, border-color 150ms ease-out, transform 120ms ease-out;
  }
  #importer .pick:hover:not(:disabled) {
    background: color-mix(in srgb, var(--accent) 13%, var(--panel)); border-color: var(--accent);
  }
  #importer .pick:active:not(:disabled) { transform: scale(0.99); }
  #importer .pick:disabled { cursor: progress; }
  #importer .badge {
    width: 40px; height: 40px; flex: none; display: grid; place-items: center; border-radius: 10px;
    background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent);
  }
  #importer .badge .icon { width: 20px; height: 20px; }
  #importer .words { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  #importer .words b { font-size: 15px; font-weight: 600; }
  #importer .words small { color: var(--muted); font-size: 12.5px; line-height: 1.45; }

  #importer details summary {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer; list-style: none;
    color: var(--muted); font-size: 13px; padding: 4px 6px 4px 2px; border-radius: 6px;
  }
  #importer details summary::-webkit-details-marker { display: none; }
  #importer details summary:hover { color: var(--fg); }
  #importer details summary .icon { width: 14px; height: 14px; transition: transform 150ms ease-out; }
  #importer details[open] > summary .icon { transform: rotate(90deg); }
  #byPath { margin-top: 12px; }
  #importer .field { display: block; margin: 10px 0 6px; font-size: 13px; font-weight: 600; }
  #importer .row { display: flex; gap: 8px; }
  #importPath {
    flex: 1; min-width: 0; color: var(--fg); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 13.5px;
    font-family: "JetBrains Mono", "Cascadia Code", "Cascadia Mono", Consolas, ui-monospace, monospace;
  }
  #importPath:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  #importer button:not(.pick):not(.close) {
    font: inherit; color: var(--fg); background: transparent; border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 16px; cursor: pointer; white-space: nowrap;
  }
  #importer button:not(.pick):not(.close):hover:not(:disabled) { border-color: var(--muted); }
  #importer button.primary, #importer.no-pick #importGo {
    background: var(--accent) !important; border-color: var(--accent) !important; color: var(--bg) !important; font-weight: 600;
  }
  #importer button.primary:hover:not(:disabled) { filter: brightness(1.08); }
  #importer button:disabled { cursor: default; }
  /* Without a folder window (Linux with no zenity), typing the path is the way in. */
  #importer.no-pick .pick, #importer.no-pick #byPath > summary { display: none; }
  #importer.no-pick #byPath { margin-top: 0; }

  /* Importing: which folder, then one row per indexer. */
  #importer .where { display: flex; align-items: center; gap: 12px; }
  #importer .where code {
    color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-family: "JetBrains Mono", "Cascadia Code", "Cascadia Mono", Consolas, ui-monospace, monospace;
  }
  #importSteps { list-style: none; margin: 14px 0 0; padding: 0; border-top: 1px solid var(--line); }
  #importSteps:empty { display: none; }
  #importSteps li {
    display: grid; grid-template-columns: 16px auto minmax(0, 1fr) auto; column-gap: 10px; align-items: center;
    padding: 10px 2px; border-bottom: 1px solid var(--line); font-size: 13px;
  }
  #importSteps .lang { font-weight: 600; }
  #importSteps .name {
    color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px;
    font-family: "JetBrains Mono", "Cascadia Code", "Cascadia Mono", Consolas, ui-monospace, monospace;
  }
  #importSteps .state { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #importSteps .why { grid-column: 2 / -1; margin: 6px 0 0; color: var(--fg); font-size: 12.5px; line-height: 1.5; }
  /* A running step: a bar, and what the indexer last said. The bar fills against the last time
     this step took; with no last time it is a band that travels, so it still says "working". */
  #importSteps .live { grid-column: 2 / -1; margin-top: 8px; display: grid; gap: 5px; }
  #importSteps .bar {
    position: relative; height: 4px; border-radius: 999px; overflow: hidden;
    background: color-mix(in srgb, var(--fg) 10%, transparent);
  }
  #importSteps .bar > span {
    position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: var(--accent);
    transition: width 600ms linear;
  }
  #importSteps .bar.unknown > span { width: 32%; animation: travel 1.4s ease-in-out infinite; }
  @keyframes travel { from { left: -32%; } to { left: 100%; } }
  #importSteps .phase {
    color: var(--muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-family: "JetBrains Mono", "Cascadia Code", "Cascadia Mono", Consolas, ui-monospace, monospace;
  }
  @media (prefers-reduced-motion: reduce) {
    #importSteps .bar.unknown > span { animation: none; left: 0; opacity: 0.6; }
    #importSteps .bar > span { transition: none; }
  }
  /* Work going on behind the page: an import or an automatic re-index. */
  #work {
    display: inline-flex; align-items: center; gap: 7px; font: inherit; font-size: 12.5px; color: var(--fg);
    background: color-mix(in srgb, var(--accent) 10%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--line));
    border-radius: 999px; padding: 3px 10px; cursor: pointer; font-variant-numeric: tabular-nums;
  }
  #work[hidden] { display: none; }
  #work.idle { cursor: default; }
  #work .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
  #work.busy .dot { animation: pulse 1.2s ease-in-out infinite; }
  #work.done .dot { background: var(--born); }
  #work.failed .dot { background: var(--died); }
  @keyframes pulse { 50% { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) { #work.busy .dot { animation: none; } }
  #importSteps .why code {
    display: block; margin-top: 6px; padding: 6px 8px; border-radius: 6px; font-size: 11.5px; color: var(--muted);
    background: color-mix(in srgb, var(--fg) 6%, transparent); white-space: pre-wrap; user-select: all;
    font-family: "JetBrains Mono", "Cascadia Code", "Cascadia Mono", Consolas, ui-monospace, monospace;
  }
  #importSteps li.done .icon { color: var(--born); }
  #importSteps li.running .icon { color: var(--accent); }
  #importSteps li.failed .icon, #importSteps li.skipped .icon { color: var(--died); }
  #importSteps li.waiting .icon { color: var(--muted); }
  #importSteps li.running .state { color: var(--fg); }
  #importSteps li.running .icon { animation: spin 900ms linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #importProblem {
    display: flex; gap: 10px; margin-top: 14px; padding: 12px 14px; border-radius: 10px; font-size: 13px; line-height: 1.5;
    background: color-mix(in srgb, var(--died) 9%, var(--panel));
    border: 1px solid color-mix(in srgb, var(--died) 40%, var(--line));
  }
  #importProblem[hidden] { display: none; }
  #importProblem .icon { color: var(--died); margin-top: 2px; }
  #importProblem b { display: block; font-weight: 600; }
  #importProblem span { color: var(--muted); }
  #importDetails { margin-top: 12px; }
  #importLog {
    margin: 8px 0 0; max-height: 28vh; overflow: auto; overscroll-behavior: contain; font-size: 11.5px; line-height: 1.6;
    color: var(--muted); white-space: pre-wrap; padding: 10px 12px; border-radius: 8px;
    background: color-mix(in srgb, var(--fg) 5%, transparent);
    font-family: "JetBrains Mono", "Cascadia Code", "Cascadia Mono", Consolas, ui-monospace, monospace;
  }
  #importer .note { margin: 12px 0 0; color: var(--muted); font-size: 12.5px; }
  #importer[data-state="failed"] .note { display: none; }
  #importer .foot { display: none; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  #importer[data-state="failed"] .foot { display: flex; }

  /* Nothing imported yet: the map has nothing to show, so its controls go and the page is
     the invitation. The rings sit on the left; the text keeps a readable measure. */
  body.empty .needs-map, body.empty #projectBox { display: none !important; }
  body.empty #importer .form { max-width: 500px; }
  body.empty #importer { position: static; flex: 1; background: none; padding: 32px 24px; }
  body.empty #importer .box {
    width: min(920px, 100%); max-height: none; overflow: visible;
    display: grid; grid-template-columns: minmax(180px, 300px) minmax(0, 1fr);
    gap: 56px; align-items: center; background: none; border: none; box-shadow: none; padding: 0;
  }
  body.empty #rings { display: block; width: 100%; height: auto; overflow: visible; }
  body.empty #importer h2 { font-size: 30px; letter-spacing: -0.01em; }
  body.empty #importer .lead { display: block; margin: 10px 0 0; color: var(--muted); font-size: 15px; line-height: 1.55; max-width: 52ch; }
  body.empty #importer .choose, body.empty #importer .progress { margin-top: 26px; }
  body.empty #importer .close, body.empty #importer .note { display: none; }
  @media (max-width: 720px) {
    body.empty #importer .box { grid-template-columns: 1fr; gap: 24px; }
    body.empty #rings { width: 150px; }
    body.empty #importer h2 { font-size: 24px; }
  }

  #rings path { fill: none; stroke: var(--muted); stroke-opacity: 0.4; stroke-width: 1.1; vector-effect: non-scaling-stroke; }
  #rings path.bark { stroke: var(--accent); stroke-opacity: 1; stroke-width: 2; }
  #rings circle { fill: var(--muted); }
  /* The one moment on this page: the rings lay down from the pith outward, once. */
  #rings path { animation: ring-in 500ms var(--ease-out, ease-out) both; animation-delay: calc(var(--i) * 70ms); }
  @keyframes ring-in { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    #rings path { animation: none; }
    /* A spinner that does not spin still says "working" - the words beside it carry it. */
    #importSteps li.running .icon { animation: none; }
    #importer .pick:active:not(:disabled) { transform: none; }
  }
  #q {
    font: inherit; color: var(--fg); background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; width: 170px;
  }
  #q:focus { outline: none; border-color: var(--accent); }
  #hits {
    position: absolute; top: calc(100% + 4px); left: 0; z-index: 20; margin: 0; padding: 4px 0;
    list-style: none; min-width: 360px; max-width: 520px; max-height: 60vh; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18); font-size: 13px;
  }
  #hits li { padding: 6px 12px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #hits li.on { background: var(--bg); box-shadow: inset 3px 0 0 var(--accent); }
  #hits li.theirs b { font-weight: 500; color: var(--muted); }
  #hits li .meta { color: var(--muted); margin-left: 6px; }
  #hits li.none { color: var(--muted); cursor: default; }
  #crumbs button {
    background: none; border: none; color: var(--muted); cursor: pointer;
    font: inherit; padding: 2px 4px; border-radius: 4px;
  }
  #crumbs button:hover { background: var(--bg); color: var(--fg); }
  #crumbs b { font-weight: 600; }
  .spacer { flex: 1; }
  select, #panel button {
    font: inherit; color: var(--fg); background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px;
  }
  #panel button { cursor: pointer; }

  /* Motion, kept to what carries meaning. One curve for things arriving - a strong ease-out
     that lands quickly and settles. Nothing here runs on the keyboard paths (search, Esc). */
  :root { --ease-out: cubic-bezier(0.23, 1, 0.32, 1); }

  /* A press answers the hand. */
  #up, #panel button:not(.link), #importer .foot button, #importer .row button, #crumbs button { transition: transform 120ms ease-out; }
  #up:active:not(:disabled), #panel button:not(.link):active,
  #importer .foot button:active:not(:disabled), #importer .row button:active:not(:disabled), #crumbs button:active { transform: scale(0.97); }

  /* The panel does not blank out to "Loading..." on every click: it keeps what it shows and,
     only if the answer is slow, dims it. A fast answer never flickers. */
  #panel { transition: opacity 120ms ease-out; }
  #panel.stale { opacity: 0.55; transition: opacity 120ms ease-out 100ms; }
  @starting-style { #panel { opacity: 0; } }

  /* The import dialog arrives rather than appears - it is opened rarely, and on purpose. */
  #importer { transition: opacity 200ms ease-out; }
  #importer .box { transition: opacity 200ms var(--ease-out), transform 200ms var(--ease-out); }
  @starting-style {
    #importer { opacity: 0; }
    #importer .box { opacity: 0; transform: scale(0.96); }
  }

  /* Less motion: keep the fades, which carry the change, and drop what moves or scales. */
  @media (prefers-reduced-motion: reduce) {
    #up:active:not(:disabled), #panel button:not(.link):active,
    #importer .foot button:active:not(:disabled), #importer .row button:active:not(:disabled), #crumbs button:active { transform: none; }
    @starting-style { #importer .box { transform: none; } }
  }

  #middle { flex: 1; min-height: 0; display: flex; position: relative; }

  /* The legend: what each colour, line and shape means, and a box to turn each one off.
     It floats over the map's corner and folds away to its title. */
  #legendCard {
    position: absolute; left: 12px; bottom: 12px; z-index: 5; width: 212px;
    max-height: calc(100% - 24px); overflow-y: auto; overscroll-behavior: contain;
    background: color-mix(in srgb, var(--panel) 92%, transparent); color: var(--fg);
    border: 1px solid var(--line); border-radius: 12px; font-size: 12.5px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.22); backdrop-filter: blur(6px);
  }
  #legendCard[hidden] { display: none; }
  #legendToggle {
    width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 9px 12px; border: none; background: none; color: var(--fg); font: inherit; font-weight: 600;
    cursor: pointer; border-radius: 12px;
  }
  #legendToggle:hover { background: color-mix(in srgb, var(--fg) 5%, transparent); }
  #legendToggle .icon {
    width: 14px; height: 14px; fill: none; stroke: var(--muted); stroke-width: 1.6;

  }
  #legendToggle[aria-expanded="false"] .icon { transform: rotate(180deg); }
  #legendBody { padding: 0 8px 8px; }
  #legendBody[hidden] { display: none; }
  #legendBody h4 {
    margin: 8px 4px 4px; font-size: 11.5px; font-weight: 600; color: var(--muted);
  }
  #legendBody h4:first-child { margin-top: 0; }
  #legendBody label {
    display: grid; grid-template-columns: 16px 30px minmax(0, 1fr) auto; align-items: center; gap: 8px;
    padding: 4px; border-radius: 7px; cursor: pointer; user-select: none;
  }
  #legendBody label:hover { background: color-mix(in srgb, var(--fg) 6%, transparent); }
  #legendBody input { margin: 0; width: 14px; height: 14px; accent-color: var(--accent); cursor: pointer; }
  /* A row that is a key, not a switch: structure cannot be hidden from a tree of structure. */
  #legendBody label.key { cursor: default; }
  #legendBody label.key:hover { background: none; }
  #legendBody svg.swatch { width: 30px; height: 14px; overflow: visible; }
  #legendBody .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #legendBody .n { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 11.5px; }
  /* What is switched off stays listed, so it can be switched back on - just quieter. */
  #legendBody label.off .name, #legendBody label.off svg.swatch { opacity: 0.4; }
  #stage { flex: 1; min-width: 0; cursor: grab; touch-action: none; }
  #stage.dragging { cursor: grabbing; }
  .warn { background: var(--warn-bg); color: var(--warn); border-radius: 6px; padding: 2px 8px; }
  .label { pointer-events: none; user-select: none; }
  .node { cursor: pointer; }
  .born { color: var(--born); }
  .died { color: var(--died); }

  #panel {
    width: 370px; flex: none; overflow-y: auto; background: var(--panel);
    border-left: 1px solid var(--line); padding: 14px 16px; font-size: 13px;
  }
  #panel[hidden] { display: none; }
  #panel h2 { margin: 0; font-size: 16px; font-weight: 600; }
  #panel h3 {
    margin: 16px 0 6px; font-size: 12px; font-weight: 600;
    color: var(--muted); letter-spacing: 0.04em;
  }
  #panel code, #panel .sig {
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12px;
    overflow-wrap: anywhere;
  }
  #panel .kindline { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 4px 0 2px; }
  #panel .kindline .swatch { width: 22px; height: 14px; flex: none; }
  #panel .kindline .kind { font-weight: 600; font-size: 13px; }
  #panel .chip {
    font-size: 11px; line-height: 1; padding: 3px 7px; border-radius: 999px; color: var(--fg);
    background: color-mix(in srgb, var(--fg) 9%, transparent); border: 1px solid var(--line);
  }
  #panel .type {
    color: var(--muted); font-size: 11.5px; overflow-wrap: anywhere;
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  #panel .sig {
    display: block; background: var(--bg); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 8px; margin: 8px 0;
  }
  #panel .meta { color: var(--muted); margin-top: 2px; }

  /* The doc comment: prose, not code. A hairline on the left sets it apart from the
     declaration above it; long ones fold at eight lines and open in place. */
  #panel .doc {
    margin: 10px 0 4px; padding: 1px 0 1px 10px; border-left: 2px solid var(--line);
    line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere;
    color: color-mix(in srgb, var(--fg) 88%, var(--muted));
  }
  #panel .doc.folded {
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 8; overflow: hidden;
  }
  #panel .doc code, #panel .summary code {
    font-size: 11.5px; padding: 0 4px; border-radius: 4px;
    background: color-mix(in srgb, var(--fg) 8%, transparent);
  }
  #panel .doc strong { font-weight: 600; color: var(--fg); }
  #panel .docToggle {
    font: inherit; font-size: 12px; color: var(--muted); background: none; border: none;
    padding: 2px 0 2px 12px; cursor: pointer;
  }
  #panel .docToggle:hover { color: var(--fg); }
  #panel li .summary {
    color: var(--muted); font-size: 12px; margin-top: 1px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #panel ul { list-style: none; margin: 0; padding: 0; }
  #panel li { padding: 3px 0; border-bottom: 1px solid var(--line); }
  #panel li:last-child { border-bottom: none; }
  #panel .link {
    font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer;
    border-bottom: 1px dotted var(--muted); text-align: left;
  }
  #panel .link:hover { border-bottom-style: solid; }
  #panel h2 { overflow-wrap: anywhere; text-wrap: balance; }

  /* Keyboard focus is shown; a mouse click does not leave a ring behind. */
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #counts, #panel .meta, #hits .meta { font-variant-numeric: tabular-nums; }
  #importLog { overscroll-behavior: contain; }

  #panel .none { color: var(--muted); }
  #panelClose { float: right; }
  #legend .hint { opacity: 0.6; margin-right: 10px; }
  .label.anchor { font-weight: 700; letter-spacing: 0.02em; }
</style>

let dom = null;
let highlight = null;
// What a search took you to. Unlike the hover highlight it stays until you move on.

let flight = null;
let drift = 0;
let dragging = null;
let depthKey = "";

let visibleLabels = new Set();
let stars = [];
let rotX = -0.35, rotY = 0.6, zoom = 1, fit = 1;

const isSkyfall = () => document.documentElement.dataset.theme === "skyfall";

// Obsidian is flat: no depth, no turning. Dragging empty space moves the page, dragging a
// node moves the node and pulls what it is tied to, and the wheel zooms where you point.
const isObsidian = () => document.documentElement.dataset.theme === "obsidian";
let panX = 0, panY = 0;

// Names come out as you zoom in, like Obsidian's text fade: the loudest first.
const LABEL_ZOOM = [0, 1.25, 1.9];

function applyLanguage(name) {
  lang = STRINGS[name] ? name : "en";
  document.documentElement.lang = lang;
  langSelect.value = lang;
  try { localStorage.setItem("treering-lang", lang); } catch { /* fine without it */ }

  for (const node of document.querySelectorAll("[data-t]")) node.textContent = t(node.dataset.t);
  for (const node of document.querySelectorAll("[data-t-label]")) {
    node.setAttribute("aria-label", t(node.dataset.tLabel));
    // An icon says nothing to someone who has not learned it yet - the name shows on hover.
    if (node.tagName === "BUTTON" && !node.textContent.trim()) node.title = t(node.dataset.tLabel);
  }
  syncTools();
  const importOption = document.querySelector('#project option[value="__import"]');
  if (importOption) importOption.textContent = t("importOption");
  searchBox.placeholder = t("searchPlaceholder");
  searchBox.setAttribute("aria-label", t("searchPlaceholder").replace(/[…/\s]+$/, ""));

  fill(granularitySelect, [["module", t("module")], ["namespace", t("namespace")], ["type", t("type")]]);
  fill(labelSelect, [["auto", t("labelAuto")], ["all", t("labelAll")], ["none", t("labelNone")]]);
  fill(styleSelect, STYLES.map(name => [name, t("style" + name[0].toUpperCase() + name.slice(1))]));
  fill(scopeSelect, [["all", t("scopeAll")], ["own", t("scopeOwn")]]);
  fill(themeSelect, [
    ["auto", t("themeAuto")], ["light", t("themeLight")],
    ["dark", t("themeDark")], ["slate", t("themeSlate")], ["skyfall", t("themeSkyfall")],
    ["obsidian", t("themeObsidian")],
  ]);

  if (fromSelect.options.length) fromSelect.options[0].textContent = t("compareNone");
  if (trail[0].label === null || STRINGS.en.all === trail[0].label || STRINGS.ko.all === trail[0].label) {
    trail[0].label = t("all");
  }

  drawCrumbs();
  drawLegend();
  if (graph) describeCounts();
  // The panel was built in the old language and stays on screen. Build it again.
  if (openDetail !== null && !panel.hidden) showDetail(openDetail);
}

function fill(select, options) {
  const keep = select.value;
  select.innerHTML = options.map(([value, label]) => `<option value="${value}">${label}</option>`).join("");
  if (keep) select.value = keep;
}

function drawLegend() {
  // What the marks mean lives in the legend card now; the footer keeps the one line on how to move.
  legend.innerHTML = `<span class="hint">${t(isTree() ? "hintTree" : "hintMouse")}</span>`;
  document.body.classList.toggle("tree-view", isTree());
  renderLegendCard();
}

// ---- the legend card ----------------------------------------------------------------
// Every colour, line and shape on the map, each with a box. A box turned off hides that kind of
// node - and the lines that touch it - or that kind of line, where it stands: nothing is laid
// out again, so what stays on screen does not move. "Libraries" is the Scope setting itself,
// the same one as the switch on the bar; it asks the server again rather than hide.
let legendOff = new Set();
try { legendOff = new Set(JSON.parse(localStorage.getItem("treering-legend-off") || "[]")); } catch { /* fine */ }

const EDGE_KIND = { 1: "contains", 2: "inherits", 3: "reference" };
const nodeKind = node =>
  node.container || node.kind === SYMBOL_NAMESPACE || node.kind === SYMBOL_PACKAGE ? "module"
    : ["interface", "enum", "record", "struct", "delegate"].includes(node.flavor) ? node.flavor
    : "class";

function legendHides(node) {
  if (!node) return false;
  if (!node.container && node.own && legendOff.has("ours")) return true;
  return legendOff.has(nodeKind(node));
}

function legendHidesEdge(edge) {
  if (legendOff.has(EDGE_KIND[edge.kind] ?? "reference")) return true;
  if (edge.state === "born" && legendOff.has("added")) return true;
  if (edge.state === "died" && legendOff.has("removed")) return true;
  return legendHides(nodeById.get(edge.from)) || legendHides(nodeById.get(edge.to));
}

function swatch(body) {
  return `<svg class="swatch" viewBox="0 0 30 14" aria-hidden="true">${body}</svg>`;
}

const TREE_KIND_NAME = () => ({
  module: t("legendModuleOnly"), namespace: t("legendNamespace"),
  class: t("legendClass"), interface: t("legendInterface"), enum: t("legendEnum"), record: t("legendRecord"),
  struct: t("legendStruct"), delegate: t("legendDelegate"),
  method: t("legendMethod"), property: t("legendProperty"), field: t("legendField"), event: t("legendEvent"),
});

function legendRows(body, groups, { keyOnly = [] } = {}) {
  const on = key => key === "theirs" ? scopeSelect.value !== "own" : !legendOff.has(key);
  const number = n => new Intl.NumberFormat(lang === "ko" ? "ko-KR" : "en-US").format(n);
  body.innerHTML = groups.map(([title, rows]) => {
    // A kind with nothing on screen says nothing - unless it was switched off, so it can come back.
    const shown = rows.filter(([key, , , n, always]) => always || n > 0 || legendOff.has(key));
    if (!shown.length) return "";
    return `<h4>${title}</h4>` + shown.map(([key, name, art, n]) => keyOnly.includes(key)
      ? `<label class="key"><span></span>${art}<span class="name">${escapeHtml(name)}</span><span class="n">${number(n)}</span></label>`
      : `<label class="${on(key) ? "" : "off"}"><input type="checkbox" data-legend="${key}"${on(key) ? " checked" : ""}>` +
        `${art}<span class="name">${escapeHtml(name)}</span><span class="n">${key === "theirs" && !on(key) ? "" : number(n)}</span></label>`).join("");
  }).join("");
}

// The tree's legend: what each mark means, counted over the rows on screen. Types and members
// can be switched off; modules and namespaces are the tree itself, so they are a key only.
function renderTreeLegend(body) {
  const rows = (treeDom?.rows ?? []).filter(row => row.node).map(row => row.node);
  const count = kind => rows.filter(node => treeKind(node) === kind).length;
  const names = TREE_KIND_NAME();
  const row = kind => [kind, names[kind], treeMarkSvg(kind, kindColour(kind)), count(kind)];
  legendRows(body, [
    [t("legendCode"), [
      ["ours", t("legendOursItem"), treeMarkSvg("class", kindColour("class")), rows.filter(node => node.own).length, true],
      ["theirs", t("legendTheirsItem"), treeMarkSvg("class", kindColour("class")).replace("<g ", '<g opacity="0.45" '),
        rows.filter(node => !node.own).length, true],
    ]],
    [t("legendStructure"), [row("module"), row("namespace")]],
    [t("legendTypes"), ["class", "interface", "enum", "record", "struct", "delegate"].map(row)],
    [t("legendMembers"), ["method", "property", "field", "event"].map(row)],
  ], { keyOnly: ["ours", "module", "namespace"] });
}

function renderLegendCard() {
  const body = document.getElementById("legendBody");
  if (!body) return;
  if (isTree()) { renderTreeLegend(body); return; }
  const nodes = graph?.nodes ?? [];
  const edges = graph?.edges ?? [];
  const count = (list, test) => list.filter(test).length;
  const hues = palette().hues;
  const shape = inner => swatch(`<g transform="translate(15 7) scale(5)" fill="currentColor" fill-opacity="0.75">${inner}</g>`);

  const groups = [
    [t("legendCode"), [
      ["ours", t("legendOursItem"), swatch(`<circle cx="9" cy="7" r="4.5" fill="${hues[0]}"/><circle cx="20" cy="7" r="4.5" fill="${hues[1]}"/>`),
        count(nodes, n => n.own && !n.container)],
      ["theirs", t("legendTheirsItem"), swatch(`<circle cx="15" cy="7" r="4.5" fill="${palette().grey}"/>`),
        count(nodes, n => !n.own && !n.container)],
    ]],
    [t("legendLinks"), [
      ["reference", t("legendReference"), swatch('<polygon points="2,4 28,6.3 28,7.7 2,10" fill="currentColor" fill-opacity="0.6"/>'),
        count(edges, e => e.kind === 3)],
      ["inherits", t("legendInherits"), swatch('<line x1="2" y1="7" x2="28" y2="7" stroke="currentColor" stroke-width="1.3" stroke-dasharray="1 4" stroke-linecap="round"/>'),
        count(edges, e => e.kind === KIND_INHERIT)],
      ["contains", t("legendContains"), swatch('<line x1="2" y1="7" x2="28" y2="7" stroke="currentColor" stroke-width="1" stroke-opacity="0.45"/>'),
        count(edges, e => e.kind === KIND_CONTAINS)],
    ]],
    [t("legendKinds"), [
      ["module", t("legendModule"), swatch('<circle cx="15" cy="7" r="6" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-opacity="0.5"/>'),
        count(nodes, n => nodeKind(n) === "module")],
      ["class", t("legendClass"), shape('<circle r="1"/>'), count(nodes, n => nodeKind(n) === "class")],
      ["interface", t("legendInterface"), shape('<circle r="0.8" fill="none" stroke="currentColor" stroke-width="0.42"/>'),
        count(nodes, n => nodeKind(n) === "interface")],
      ["enum", t("legendEnum"), shape('<polygon points="0,-1 1,0 0,1 -1,0"/>'), count(nodes, n => nodeKind(n) === "enum")],
      ["record", t("legendRecord"), shape('<rect x="-0.85" y="-0.85" width="1.7" height="1.7" rx="0.55"/>'),
        count(nodes, n => nodeKind(n) === "record")],
      ["struct", t("legendStruct"), shape('<rect x="-0.85" y="-0.85" width="1.7" height="1.7"/>'),
        count(nodes, n => nodeKind(n) === "struct")],
      ["delegate", t("legendDelegate"), shape('<polygon points="0,-1 0.95,0.7 -0.95,0.7"/>'),
        count(nodes, n => nodeKind(n) === "delegate")],
    ]],
  ];
  if (fromSelect.value) {
    groups.push([t("legendChanges"), [
      ["added", t("legendAdded"), swatch('<polygon points="2,4 28,6.3 28,7.7 2,10" fill="var(--born)"/>'), count(edges, e => e.state === "born")],
      ["removed", t("legendRemoved"), swatch('<line x1="2" y1="7" x2="28" y2="7" stroke="var(--died)" stroke-width="1.5" stroke-dasharray="4 3"/>'),
        count(edges, e => e.state === "died")],
    ]]);
  }

  // A kind that is not on the map says nothing; the code and line rows always stay.
  const always = ["ours", "theirs", "reference", "inherits", "contains", "added", "removed"];
  legendRows(body, groups.map(([title, rows]) => [title, rows.map(r => [...r, always.includes(r[0])])]));
}

document.getElementById("legendBody").addEventListener("change", event => {
  const key = event.target.dataset?.legend;
  if (!key) return;
  if (key === "theirs") {
    scopeSelect.value = event.target.checked ? "all" : "own";
    scopeSelect.dispatchEvent(new Event("change"));
    return;   // the reload redraws the card
  }
  if (event.target.checked) legendOff.delete(key); else legendOff.add(key);
  try { localStorage.setItem("treering-legend-off", JSON.stringify([...legendOff])); } catch { /* fine */ }
  event.target.closest("label").classList.toggle("off", !event.target.checked);
  if (isTree()) { buildTree(); paintTree(); return; }
  lastLabelPass = 0;
  paint();
});

const legendToggle = document.getElementById("legendToggle");
function setLegendOpen(open) {
  legendToggle.setAttribute("aria-expanded", String(open));
  document.getElementById("legendBody").hidden = !open;
  try { localStorage.setItem("treering-legend-open", open ? "1" : "0"); } catch { /* fine */ }
}
legendToggle.addEventListener("click", () => setLegendOpen(legendToggle.getAttribute("aria-expanded") !== "true"));
try { if (localStorage.getItem("treering-legend-open") === "0") setLegendOpen(false); } catch { /* fine */ }

function applyTheme(name) {
  const wasFlat = isObsidian();
  if (name === "auto") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = name;
  // Flat and 3D are different layouts, not just different paint.
  if (graph && wasFlat !== isObsidian()) layout(graph.nodes, graph.edges);
  try { localStorage.setItem("treering-theme", name); } catch { /* fine without it */ }
  themeSelect.value = name;
  drawLegend();   // its colour swatches are the theme's
  document.querySelector('meta[name="theme-color"]')
    ?.setAttribute("content", getComputedStyle(document.documentElement).getPropertyValue("--bg").trim());
  if (graph || isTree()) { build(); paint(); }
}

function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a += 0x6d2b79f5;
    let x = a;
    x = Math.imul(x ^ (x >>> 15), x | 1);
    x ^= x + Math.imul(x ^ (x >>> 7), x | 61);
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
}

// A style only decides WHERE things sit. Colour, shape and line stay the same -
// it is the same graph seen from another angle, not another graph.
const STYLES = ["constellation", "orbit", "rings", "layers", "tree"];
const isTree = () => style === "tree";
let style = "constellation";

// Each shape is worth looking at from somewhere in particular: the ring wants to be
// seen face on, the tiers from the side. Set the camera once, then leave it to the reader.
const CAMERA = { constellation: -0.35, orbit: -0.35, rings: -1.3, layers: -0.08 };
const CAMERA_TURN = { layers: 0.14 };

// Shapes meant to be read from one angle. They hold still and are framed to the screen's
// own width and height; the free-floating ones spin slowly and are framed as a ball.
const FIXED_ANGLE = new Set(["rings", "layers"]);
let framing = null;

// The opened first screen is laid out on a plane facing the camera, so it holds still and
// is framed to the screen too. It can still be turned by dragging.
const opened = () => Boolean(graph && graph.opened);
const holdsStill = () => FIXED_ANGLE.has(style) || opened() || isObsidian() || isTree();

function applyStyle(name) {
  const moved = style !== name;
  const wasTree = isTree();
  style = STYLES.includes(name) ? name : "constellation";
  styleSelect.value = style;
  syncTools();
  try { localStorage.setItem("treering-style", style); } catch { /* fine without it */ }
  if (moved) {
    rotX = CAMERA[style] ?? -0.35;
    if (CAMERA_TURN[style] !== undefined) rotY = CAMERA_TURN[style];
  }

  if (wasTree !== isTree()) {
    drawLegend();
    zoom = 1; panX = 0; panY = 0;
    if (graph || treeDom) load();
    return;
  }

  if (graph) {
    layout(graph.nodes, graph.edges);
    build();
    flight = null;
    paint();
  }
}

// Points spread evenly over a sphere. Deterministic, and it never clumps at the poles
// the way latitude/longitude does.
function onSphere(i, count, radius) {
  if (count <= 1) return { x: 0, y: 0, z: radius };
  const y = 1 - (2 * i + 1) / count;
  const r = Math.sqrt(Math.max(0, 1 - y * y));
  const angle = i * 2.39996;
  return { x: Math.cos(angle) * r * radius, y: y * radius, z: Math.sin(angle) * r * radius };
}

// How much traffic each node carries. Several styles rank by it, so it is worked out once.
function weightsOf(nodes, links) {
  const weight = new Float64Array(nodes.length);
  for (const link of links) { weight[link.a] += link.w; weight[link.b] += link.w; }
  return weight;
}

function layout(nodes, edges) {
  framing = null;
  panX = 0;
  panY = 0;
  const random = rng(SEED);
  const index = new Map(nodes.map((node, i) => [node.id, i]));
  const n = Math.max(1, nodes.length);
  const k = 240 / Math.cbrt(n);

  nodes.forEach((node, i) => {
    node.x = (random() - 0.5) * k * n;
    node.y = (random() - 0.5) * k * n;
    // Starting everything on one plane keeps the force layout on it - flat for Obsidian.
    node.z = isObsidian() ? 0 : (random() - 0.5) * k * n;
    node.phase = i * 2.39996;
    node.amp = k * DRIFT;
  });

  // The node you went inside is not one of the things being laid out - it is what they
  // sit in. Lay out the rest, then put it above them.
  const anchor = nodes.find(node => node.anchor);

  // Module bubbles. In the force layout they take part as hubs, pulling their namespaces
  // together; in the shapes with a fixed geometry they sit at the middle of what they hold.
  const floating = style === "constellation";
  const containers = nodes.filter(node => node.container);
  const placed = nodes.filter(node => node !== anchor && (floating || !node.container));
  const placedIndex = new Map(placed.map((node, i) => [node.id, i]));

  const heaviest = Math.max(1, ...edges.map(edge => edge.weight));
  const links = edges
    .map(edge => ({
      a: placedIndex.get(edge.from), b: placedIndex.get(edge.to),
      w: edge.kind === KIND_CONTAINS ? heaviest * 0.6 : edge.weight,
    }))
    .filter(link => link.a !== undefined && link.b !== undefined && link.a !== link.b);

  if (containers.length && (style === "constellation" || style === "orbit")) {
    // Modules first, then what is in them - so that one module's bubble never swallows
    // another's. Laid out together, heavy wiring between modules pulled their namespaces
    // into one heap and Core's bubble sat inside 상점앱's, reading as if it were part of it.
    clustered(nodes, edges, k, random);
  } else if (style === "orbit") orbit(placed, links, k);
  else if (style === "rings") rings(placed, links, k);
  else if (style === "layers") layers(placed, links, k);
  else constellation(placed, links, k, random);

  if (!floating && !(containers.length && style === "orbit")) {
    for (const container of containers) {
      const held = edges.filter(edge => edge.from === container.id).map(edge => nodeById.get(edge.to)).filter(Boolean);
      const n = Math.max(1, held.length);
      container.x = held.reduce((sum, node) => sum + node.x, 0) / n;
      container.y = held.reduce((sum, node) => sum + node.y, 0) / n;
      container.z = held.reduce((sum, node) => sum + node.z, 0) / n;
    }
  }

  if (anchor) placeAnchor(anchor, placed, edges, k);

  // Flat means looking straight at x-y. The ring lies in x-z, so it is turned to face us;
  // everything else just loses its depth.
  if (isObsidian()) {
    for (const node of nodes) {
      if (style === "rings") { node.y = node.z; }
      node.z = 0;
    }
  }

  settle(nodes, k);

  // The view is scaled to what is laid out, not to the anchor. Keep the anchor inside
  // that reach so it is on screen without dictating how small everything else is drawn.
  if (anchor) {
    const reach = Math.max(1, ...placed.map(node => Math.hypot(node.x, node.y, node.z)));
    const distance = Math.hypot(anchor.x, anchor.y, anchor.z);
    // Short of the edge: the ring is drawn large and its name sits above it.
    if (distance > reach * 0.88) {
      const pull = (reach * 0.88) / distance;
      anchor.x *= pull; anchor.y *= pull; anchor.z *= pull;
    }
  }
}

// Group by module, lay the groups out as if each were one node, lay each group out on its
// own, then push the groups apart until no two overlap.
function clustered(nodes, edges, k, random) {
  const containers = nodes.filter(node => node.container);
  const groupOf = new Map();
  const groups = [];

  for (const container of containers) {
    const members = edges
      .filter(edge => edge.from === container.id && edge.kind === KIND_CONTAINS)
      .map(edge => nodeById.get(edge.to))
      .filter(Boolean);
    const group = { container, members };
    groups.push(group);
    for (const member of members) groupOf.set(member.id, group);
  }

  // Everything not in a bubble - the libraries - is a group of one.
  for (const node of nodes) {
    if (node.container || node.anchor || groupOf.has(node.id)) continue;
    const group = { container: null, members: [node] };
    groups.push(group);
    groupOf.set(node.id, group);
  }

  // 1. The groups, as single nodes, wired by the sum of what runs between them.
  const kGroup = 240 / Math.cbrt(Math.max(1, groups.length));
  const index = new Map(groups.map((group, i) => [group, i]));
  const between = new Map();
  for (const edge of edges) {
    if (edge.kind === KIND_CONTAINS) continue;
    const a = groupOf.get(edge.from), b = groupOf.get(edge.to);
    if (!a || !b || a === b) continue;
    const key = index.get(a) + ">" + index.get(b);
    between.set(key, (between.get(key) || 0) + edge.weight);
  }
  const groupLinks = [...between].map(([key, w]) => {
    const [a, b] = key.split(">").map(Number);
    return { a, b, w };
  });
  const spots = groups.map(() => ({ x: 0, y: 0, z: 0 }));
  spots.forEach((spot, i) => {
    spot.x = (random() - 0.5) * kGroup * groups.length;
    spot.y = (random() - 0.5) * kGroup * groups.length;
    spot.z = (random() - 0.5) * kGroup * groups.length;
  });
  if (style === "orbit") orbit(spots, groupLinks, kGroup);
  else constellation(spots, groupLinks, kGroup, random);

  // Bubbles are drawn flat on the screen, so groups must be apart on the screen, not just
  // in space - two groups a long way apart in depth still sit on top of each other once
  // projected. The groups go on a plane facing the camera, keeping a little depth.
  for (const spot of spots) spot.z *= 0.2;

  // 2. Each group on its own, scaled to a radius that grows with what it holds.
  groups.forEach((group, i) => {
    const count = group.members.length;
    group.radius = count > 1 ? kGroup * 0.42 * Math.sqrt(count) : kGroup * 0.12;
    group.spot = spots[i];
    if (count < 2) {
      for (const member of group.members) { member.lx = 0; member.ly = 0; member.lz = 0; }
      return;
    }

    const local = group.members.map(() => ({ x: 0, y: 0, z: 0 }));
    const at = new Map(group.members.map((member, j) => [member.id, j]));
    const inner = edges
      .filter(edge => edge.kind !== KIND_CONTAINS && at.has(edge.from) && at.has(edge.to) && edge.from !== edge.to)
      .map(edge => ({ a: at.get(edge.from), b: at.get(edge.to), w: edge.weight }));
    local.forEach(point => {
      point.x = (random() - 0.5) * 100; point.y = (random() - 0.5) * 100; point.z = (random() - 0.5) * 100;
    });
    constellation(local, inner, 240 / Math.cbrt(count), random);

    const cx = local.reduce((s, p) => s + p.x, 0) / count;
    const cy = local.reduce((s, p) => s + p.y, 0) / count;
    const cz = local.reduce((s, p) => s + p.z, 0) / count;
    const far = Math.max(1, ...local.map(p => Math.hypot(p.x - cx, p.y - cy, p.z - cz)));
    group.members.forEach((member, j) => {
      member.lx = ((local[j].x - cx) / far) * group.radius;
      member.ly = ((local[j].y - cy) / far) * group.radius;
      member.lz = ((local[j].z - cz) / far) * group.radius * 0.35;
    });
  });

  // 3. No two groups overlap - on screen, which is where it counts. A bubble is drawn a fixed
  //    number of pixels outside its members, and members are dots a fixed number of pixels
  //    wide, whatever the scale. So the margin needed in layout units depends on how far the
  //    picture will be scaled down to fit. Guess that scale from the arrangement as it
  //    stands, space the groups for it, and guess again - it settles in a few rounds.
  //    Margins kept in layout units alone let busy maps overlap by twenty pixels.
  const BUBBLE_PX = 22 + 14, LONE_PX = 10;
  const separate = () => {
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const group of groups) {
      minX = Math.min(minX, group.spot.x - group.radius); maxX = Math.max(maxX, group.spot.x + group.radius);
      minY = Math.min(minY, group.spot.y - group.radius); maxY = Math.max(maxY, group.spot.y + group.radius);
    }
    const width = Math.max(320, stage.clientWidth), height = Math.max(240, stage.clientHeight);
    const scale = Math.max(0.05, Math.min(
      (width * 0.72) / Math.max(1, maxX - minX), (height * 0.66) / Math.max(1, maxY - minY)));
    const pad = group => (group.container ? BUBBLE_PX : LONE_PX) / scale;

    for (let pass = 0; pass < 120; pass++) {
      let moved = false;
      for (let i = 0; i < groups.length; i++) {
        for (let j = i + 1; j < groups.length; j++) {
          const a = groups[i], b = groups[j];
          const need = a.radius + pad(a) + b.radius + pad(b);
          let dx = b.spot.x - a.spot.x, dy = b.spot.y - a.spot.y;
          let d = Math.hypot(dx, dy);
          if (d >= need) continue;
          if (d < 0.001) { dx = random() - 0.5; dy = random() - 0.5; d = Math.hypot(dx, dy); }
          const push = (need - d) / 2 / d;
          a.spot.x -= dx * push; a.spot.y -= dy * push;
          b.spot.x += dx * push; b.spot.y += dy * push;
          moved = true;
        }
      }
      if (!moved) break;
    }
  };
  for (let round = 0; round < 4; round++) separate();

  // Screens are wide. Turn the arrangement so its long side runs across rather than down -
  // the groups often string out along one line, and standing up it wastes most of the width.
  {
    let sx = 0, sy = 0, total = 0;
    for (const group of groups) { const w = 1 + group.radius; sx += group.spot.x * w; sy += group.spot.y * w; total += w; }
    const mx = sx / total, my = sy / total;
    let xx = 0, yy = 0, xy = 0;
    for (const group of groups) {
      const w = 1 + group.radius, dx = group.spot.x - mx, dy = group.spot.y - my;
      xx += w * dx * dx; yy += w * dy * dy; xy += w * dx * dy;
    }
    const angle = 0.5 * Math.atan2(2 * xy, xx - yy);
    const cos = Math.cos(-angle), sin = Math.sin(-angle);
    for (const group of groups) {
      const dx = group.spot.x - mx, dy = group.spot.y - my;
      group.spot.x = dx * cos - dy * sin;
      group.spot.y = dx * sin + dy * cos;
    }
  }

  // Turned, the picture fits the screen differently. Space it once more for that scale.
  separate();

  for (const group of groups) {
    for (const member of group.members) {
      member.x = group.spot.x + member.lx;
      member.y = group.spot.y + member.ly;
      member.z = group.spot.z + member.lz;
    }
    if (group.container) {
      group.container.x = group.spot.x;
      group.container.y = group.spot.y;
      group.container.z = group.spot.z;
    }
  }
}

// Above what it holds, centred on it. Above reads as "contains" in every shape, and in the
// ring - seen from above - it lands in the empty middle.
function placeAnchor(anchor, placed, edges, k) {
  const held = new Set(edges.filter(edge => edge.from === anchor.id).map(edge => edge.to));
  const inside = placed.filter(node => held.has(node.id));
  const around = inside.length ? inside : placed;
  const n = Math.max(1, around.length);

  anchor.x = around.reduce((sum, node) => sum + node.x, 0) / n;
  anchor.z = around.reduce((sum, node) => sum + node.z, 0) / n;
  anchor.y = Math.min(0, ...placed.map(node => node.y)) - k * (style === "layers" ? 1.6 : 0.8);
}

// The heaviest node in the middle, everything else on shells around it. Reads as
// "what is this built around" - the force layout answers that only by accident.
function orbit(nodes, links, k) {
  const weight = weightsOf(nodes, links);
  const order = nodes
    .map((_, i) => i)
    .sort((a, b) => (weight[b] - weight[a]) || (a - b));

  let placed = 0;
  for (let shell = 0; placed < order.length; shell++) {
    const size = shell === 0 ? 1 : Math.min(order.length - placed, 5 + shell * 7);
    const radius = shell === 0 ? 0 : k * (1.5 + (shell - 1) * 1.45);

    for (let i = 0; i < size; i++) {
      const node = nodes[order[placed + i]];
      const point = onSphere(i, size, radius);
      node.x = point.x; node.y = point.y; node.z = point.z;
    }

    placed += size;
  }
}

// Everything on one circle, grouped by colour, so every edge becomes a chord across it.
// This is the view for "who reaches into whom" - crossings are the point, not noise.
function rings(nodes, links, k) {
  const weight = weightsOf(nodes, links);
  const peak = Math.max(1, ...weight);

  const groups = new Map();
  nodes.forEach((node, i) => {
    const key = node.group ?? "\u0001outside";
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(i);
  });

  const ordered = [...groups.entries()].sort(
    (a, b) => (b[1].length - a[1].length) || (a[0] < b[0] ? -1 : 1));

  // A gap between groups, so the arcs read as groups rather than one long band.
  const gap = ordered.length > 1 ? 1.6 : 0;
  const slots = nodes.length + gap * ordered.length;
  const radius = k * Math.max(2.4, slots * 0.42);

  let slot = 0;
  for (const [, members] of ordered) {
    members.sort((a, b) => (weight[b] - weight[a]) || (a - b));

    for (const i of members) {
      const angle = (slot / slots) * Math.PI * 2;
      nodes[i].x = Math.cos(angle) * radius;
      nodes[i].z = Math.sin(angle) * radius;
      // Busy nodes lift out of the plane, so the ring is a shallow bowl rather than a disc.
      nodes[i].y = -(weight[i] / peak) * k * 2.2;
      slot++;
    }

    slot += gap;
  }
}

// Tiers by how deep a thing sits in the dependency chain. What calls sits above
// what is called. Cycles are broken by the pass limit - this is a picture, not a proof.
function layers(nodes, links, k) {
  // Code that calls itself round in a circle has no "above". Pushing depth along the loop
  // just keeps going until a pass limit, and everything on the loop ends up at the bottom
  // with empty tiers in between. So a loop becomes one tier, and depth is measured between
  // loops - the longest path through what is left, which has no cycles.
  const component = stronglyConnected(nodes.length, links);
  const depthOf = new Map();
  const into = new Map();
  for (const link of links) {
    const from = component[link.a], to = component[link.b];
    if (from === to) continue;
    if (!into.has(to)) into.set(to, new Set());
    into.get(to).add(from);
  }

  const measure = c => {
    if (depthOf.has(c)) return depthOf.get(c);
    depthOf.set(c, 0);   // guards against a cycle we missed; there should be none left
    let deepest = 0;
    for (const from of into.get(c) || []) deepest = Math.max(deepest, measure(from) + 1);
    depthOf.set(c, deepest);
    return deepest;
  };

  // Only the depths that occur. A tier with nothing on it is just a gap.
  const raw = nodes.map((_, i) => measure(component[i]));
  const levels = [...new Set(raw)].sort((a, b) => a - b);
  const rank = new Map(levels.map((level, i) => [level, i]));
  const depth = Int32Array.from(raw, value => rank.get(value));

  const weight = weightsOf(nodes, links);
  const tiers = new Map();
  nodes.forEach((_, i) => {
    if (!tiers.has(depth[i])) tiers.set(depth[i], []);
    tiers.get(depth[i]).push(i);
  });

  // Each tier is a row across the screen, not a little disc. Discs stacked up are a thin
  // column - a bean sprout on a wide screen. The picture is made wider than tall, since
  // that is the shape of the screen it lands on.
  const deepest = Math.max(...depth);
  const widest = Math.max(...[...tiers.values()].map(members => members.length));
  const pitch = k * 2.4;
  const width = pitch * Math.max(3, widest);
  const height = Math.max(k * 3, width * 0.6);
  const step = deepest > 0 ? height / deepest : 0;

  // Order each row under the things above it that it is tied to, so lines run down rather
  // than across. One sweep from the top is enough to take most crossings out.
  const neighbours = Array.from({ length: nodes.length }, () => []);
  for (const link of links) { neighbours[link.a].push(link.b); neighbours[link.b].push(link.a); }

  for (let level = 0; level <= deepest; level++) {
    const members = tiers.get(level) || [];
    const pull = i => {
      const above = neighbours[i].filter(j => depth[j] < level);
      return above.length ? above.reduce((sum, j) => sum + nodes[j].x, 0) / above.length : 0;
    };
    members.sort((a, b) => (pull(a) - pull(b)) || (weight[b] - weight[a]) || (a - b));

    members.forEach((i, at) => {
      nodes[i].x = (at - (members.length - 1) / 2) * pitch;
      // A shallow zig-zag in depth, so a row reads as sitting in space rather than on a wire.
      nodes[i].z = (at % 2 ? 1 : -1) * k * 0.45;
      nodes[i].y = (level - deepest / 2) * step;
    });
  }
}

// Tarjan's algorithm, without recursion - a long dependency chain would blow the stack.
function stronglyConnected(count, links) {
  const out = Array.from({ length: count }, () => []);
  for (const link of links) out[link.a].push(link.b);

  const index = new Int32Array(count).fill(-1);
  const low = new Int32Array(count);
  const onStack = new Uint8Array(count);
  const component = new Int32Array(count).fill(-1);
  const stack = [];
  let next = 0, found = 0;

  for (let root = 0; root < count; root++) {
    if (index[root] !== -1) continue;
    const work = [[root, 0]];
    index[root] = low[root] = next++;
    stack.push(root); onStack[root] = 1;

    while (work.length) {
      const top = work[work.length - 1];
      const [v, i] = top;
      if (i < out[v].length) {
        top[1]++;
        const w = out[v][i];
        if (index[w] === -1) {
          index[w] = low[w] = next++;
          stack.push(w); onStack[w] = 1;
          work.push([w, 0]);
        } else if (onStack[w]) {
          low[v] = Math.min(low[v], index[w]);
        }
        continue;
      }

      work.pop();
      if (work.length) {
        const parent = work[work.length - 1][0];
        low[parent] = Math.min(low[parent], low[v]);
      }

      if (low[v] === index[v]) {
        let w;
        do { w = stack.pop(); onStack[w] = 0; component[w] = found; } while (w !== v);
        found++;
      }
    }
  }

  return component;
}

// 3D Fruchterman-Reingold. The overview is a few hundred nodes by design, so O(n^2) is fine.
function constellation(nodes, links, k, random) {
  const maxWeight = Math.max(1, ...links.map(link => link.w));
  let temperature = k * 6;

  for (let step = 0; step < ITERATIONS; step++) {
    const fx = new Float64Array(nodes.length);
    const fy = new Float64Array(nodes.length);
    const fz = new Float64Array(nodes.length);

    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        let dx = nodes[i].x - nodes[j].x;
        let dy = nodes[i].y - nodes[j].y;
        let dz = nodes[i].z - nodes[j].z;
        let d = Math.sqrt(dx * dx + dy * dy + dz * dz);
        if (d < 0.01) { dx = random() - 0.5; dy = random() - 0.5; dz = random() - 0.5; d = 0.01; }
        const push = (k * k) / d;
        fx[i] += (dx / d) * push; fy[i] += (dy / d) * push; fz[i] += (dz / d) * push;
        fx[j] -= (dx / d) * push; fy[j] -= (dy / d) * push; fz[j] -= (dz / d) * push;
      }
    }

    for (const link of links) {
      const a = nodes[link.a], b = nodes[link.b];
      const dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z;
      const d = Math.max(0.01, Math.sqrt(dx * dx + dy * dy + dz * dz));
      const weight = 0.4 + 0.6 * (Math.log1p(link.w) / Math.log1p(maxWeight));
      const pull = ((d * d) / k) * weight;
      fx[link.a] += (dx / d) * pull; fy[link.a] += (dy / d) * pull; fz[link.a] += (dz / d) * pull;
      fx[link.b] -= (dx / d) * pull; fy[link.b] -= (dy / d) * pull; fz[link.b] -= (dz / d) * pull;
    }

    // A little gravity. Without it a node on one or two thin edges drifts out past its
    // neighbours, and since the view is scaled to fit the farthest node, one straggler
    // shrinks everything else into a clump in the middle of an empty screen.
    for (let i = 0; i < nodes.length; i++) {
      fx[i] -= nodes[i].x * GRAVITY;
      fy[i] -= nodes[i].y * GRAVITY;
      fz[i] -= nodes[i].z * GRAVITY;
    }

    for (let i = 0; i < nodes.length; i++) {
      const d = Math.max(0.01, Math.hypot(fx[i], fy[i], fz[i]));
      const move = Math.min(d, temperature) / d;
      nodes[i].x += fx[i] * move;
      nodes[i].y += fy[i] * move;
      nodes[i].z += fz[i] * move;
    }

    temperature *= 0.965;
  }
}

// Whatever put the nodes where they are, the camera expects them centred, and the
// star field is sized from how far they spread.
function settle(nodes, k) {
  // Centre on what was laid out. The anchor rides along but does not pull the middle up.
  const laid = nodes.filter(node => !node.anchor);
  const n = Math.max(1, laid.length);
  const mean = laid.reduce((sum, node) => {
    sum.x += node.x / n; sum.y += node.y / n; sum.z += node.z / n; return sum;
  }, { x: 0, y: 0, z: 0 });

  for (const node of nodes) { node.x -= mean.x; node.y -= mean.y; node.z -= mean.z; }

  // A field of far dots. They turn with the camera, so the map reads as sitting in space
  // rather than being painted on glass.
  const spread = Math.max(1, ...nodes.map(node => Math.hypot(node.x, node.y, node.z)));
  const starRandom = rng(SEED ^ 0x5eed);
  stars = Array.from({ length: 150 }, () => ({
    x: (starRandom() - 0.5) * spread * 4.2,
    y: (starRandom() - 0.5) * spread * 4.2,
    z: (starRandom() - 0.5) * spread * 4.2,
    r: 0.4 + starRandom() * 0.9,
  }));
}

// What colour means depends on what actually differs on screen. Inside a single module
// everything shares one colour, so the key falls back to the node itself.
// The first screen, opened. The API answers at namespace level; here our modules become
// bubbles holding their namespaces, and every library is folded back into one grey ball -
// a library is context, and a hundred of its namespaces would bury ours.
function openModules(g) {
  const nodes = [];
  const folded = new Map();
  const into = new Map();

  for (const node of g.nodes) {
    if (node.own) { nodes.push(node); continue; }
    const key = node.moduleId ?? node.id;
    if (!folded.has(key)) {
      folded.set(key, {
        id: key, display: node.module || node.display, kind: SYMBOL_PACKAGE,
        module: node.module, flavor: null, own: false, moduleId: key,
      });
    }
    into.set(node.id, key);
  }
  nodes.push(...folded.values());

  const merged = new Map();
  for (const edge of g.edges) {
    const from = into.get(edge.from) ?? edge.from;
    const to = into.get(edge.to) ?? edge.to;
    if (from === to) continue;
    const key = `${from}>${to}>${edge.kind}>${edge.state}`;
    const same = merged.get(key);
    if (same) same.weight += edge.weight;
    else merged.set(key, { ...edge, from, to });
  }
  const edges = [...merged.values()];

  const containers = new Map();
  const hold = (containerId, memberId) => edges.push({
    from: containerId, to: memberId, kind: KIND_CONTAINS, weight: 0, inferred: false, state: "same",
  });

  if (g.groups && g.groups.length) {
    // One package of ours: the server has split it into the branches worth seeing, so the
    // first screen is not a single bubble. A branch can itself be a node (a file that holds
    // code), so its bubble gets an id of its own and remembers the namespace it stands for.
    const module = g.nodes.find(node => node.own)?.module;
    for (const group of g.groups) {
      const id = -group.id;
      containers.set(id, {
        id, target: group.id, display: group.display, kind: SYMBOL_NAMESPACE, module,
        flavor: null, own: true, moduleId: null, container: true,
      });
      for (const member of group.members) hold(id, member);
    }
  } else {
    for (const node of g.nodes) {
      if (!node.own || node.moduleId == null) continue;
      if (!containers.has(node.moduleId)) {
        containers.set(node.moduleId, {
          id: node.moduleId, target: node.moduleId, display: node.module, kind: SYMBOL_PACKAGE,
          module: node.module, flavor: null, own: true, moduleId: node.moduleId, container: true,
        });
      }
      hold(node.moduleId, node.id);
    }
  }
  nodes.push(...containers.values());

  g.nodes = nodes;
  g.edges = edges;
}

// Colour says where a thing belongs; size and type say how much it matters. Before, every
// module got its own hue - 38 modules, 38 colours, and nothing stood out - and the biggest
// labels were whichever libraries happened to sit nearest the camera.
//
//  - What you went inside, and everything it holds, takes the first colour.
//  - Our own code takes the next colours, one per module, heaviest first.
//  - Code we did not write is grey. It is context, not the subject.
//  - Importance is a rank by how much traffic a node carries, with other people's code
//    counted at half - the top few are drawn and named the loudest.
// A module keeps its colour wherever you are. Colours used to be dealt afresh on every
// screen, so the same module was blue on the way in and green once inside - the one thing
// colour is for, telling you what belongs together, broke on the first click.
const moduleHues = new Map();
const hueForModule = name => {
  if (!moduleHues.has(name)) moduleHues.set(name, moduleHues.size);
  return moduleHues.get(name);
};

function classify(g) {
  const mass = new Map();
  for (const edge of g.edges) {
    mass.set(edge.from, (mass.get(edge.from) || 0) + edge.weight);
    mass.set(edge.to, (mass.get(edge.to) || 0) + edge.weight);
  }

  const inside = new Set(g.children || []);
  const drilled = g.nodes.some(node => node.anchor);
  for (const node of g.nodes) {
    node.mass = mass.get(node.id) || 0;
    node.group = node.own ? (node.module || node.display || "") : null;
    // Inside something, our code from elsewhere keeps its colour but steps back a little,
    // so what you went into reads first.
    node.outside = drilled && node.own && !node.anchor && !inside.has(node.id);
  }

  // New modules are dealt a colour heaviest first, so the first screen sets the order.
  const totals = new Map();
  for (const node of g.nodes) {
    if (node.group !== null) totals.set(node.group, (totals.get(node.group) || 0) + node.mass);
  }
  [...totals.keys()]
    .sort((a, b) => (totals.get(b) - totals.get(a)) || (a < b ? -1 : 1))
    .forEach(hueForModule);
  for (const node of g.nodes) node.hue = node.group === null ? -1 : hueForModule(node.group);

  const score = node => node.mass * (node.hue >= 0 ? 1 : 0.5);
  [...g.nodes]
    .filter(node => !node.anchor && !node.container)
    .sort((a, b) => (score(b) - score(a)) || (a.id - b.id))
    .forEach((node, i) => { node.rank = i; });
}

// A handful of hues that stay apart from each other, per theme. More groups than hues is
// rare - the grey takes everything that is not ours - and then they repeat.
function palette() {
  if (isSkyfall()) {
    return {
      hues: ["#46d7ff", "#58e0a8", "#ffb454", "#ff7a6b", "#a58bff", "#e8e36a", "#5fb3ff", "#ff8fd0"],
      grey: "#2d4b62",
    };
  }
  // Slate's accent is green, so no module is: a green node would read as "the one you are on".
  if (document.documentElement.dataset.theme === "slate") {
    return {
      hues: ["#60a5fa", "#f59e0b", "#f472b6", "#a78bfa", "#fb923c", "#38bdf8", "#facc15", "#f87171"],
      grey: "#475569",
    };
  }
  // No violet among them: violet is the hover accent, and it has to mean only that.
  if (isObsidian()) {
    return {
      hues: ["#6fa8dc", "#e5a86b", "#7ec699", "#e08a8a", "#d4c56b", "#6cc5c5", "#c49a6c", "#9fb3c8"],
      grey: "#5c5c5c",
    };
  }
  const dark = document.documentElement.dataset.theme === "dark"
    || (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
  return dark
    ? { hues: ["#6f9cf2", "#f0a05c", "#5cc79a", "#ee7a8d", "#b08ef0", "#e0c050", "#5cc8d8", "#d98bb0"],
        grey: "#5f5d57" }
    : { hues: ["#3a6fd8", "#d9772b", "#2f9e6e", "#c8455d", "#8a5cc9", "#b8941f", "#2a9fb0", "#a8567a"],
        grey: "#b9b6ae" };
}

// Label tiers: the few that matter most are read first, the rest are there if you look.
const LABEL_SIZE = [17, 13.5, 11];
const LABEL_WEIGHT = [700, 600, 400];
const tierOf = node =>
  node.anchor || node.container ? 0 : node.hue < 0 ? 2
    : node.rank < 3 ? (node.outside ? 1 : 0) : node.rank < 10 ? 1 : 2;

// Cut long names in the middle. The end of a dotted name is what tells two packages apart -
// "Microsoft.EntityFrameworkCo…" said nothing about which of four it was.
const shorten = name => name.length > 30 ? name.slice(0, 12) + "…" + name.slice(-16) : name;

function colorOf(node) {
  const { hues, grey } = palette();
  return node && node.hue >= 0 ? hues[node.hue % hues.length] : grey;
}

function el(name, attrs) {
  const node = document.createElementNS(SVG, name);
  for (const key in attrs) node.setAttribute(key, attrs[key]);
  return node;
}

// A flat disc reads as a sticker. A lit sphere reads as an object sitting in depth,
// which is most of what makes the map feel three-dimensional.
function sphereGradient(defs, color, id) {
  const gradient = el("radialGradient", { id, cx: "0.34", cy: "0.30", r: "0.78" });
  gradient.append(
    el("stop", { offset: "0%", "stop-color": "#fff", "stop-opacity": "0.55" }),
    el("stop", { offset: "38%", "stop-color": color, "stop-opacity": "1" }),
    el("stop", { offset: "100%", "stop-color": color, "stop-opacity": "0.72" }));
  defs.append(gradient);
  return `url(#${id})`;
}

function shapeFor(node, fill, stroke) {
  switch (node.flavor) {
    case "interface":
      return el("circle", { r: 0.8, fill: "none", stroke, "stroke-width": 0.42 });
    case "enum":
      return el("polygon", { points: "0,-1 1,0 0,1 -1,0", fill });
    case "struct":
      return el("rect", { x: -0.85, y: -0.85, width: 1.7, height: 1.7, fill });
    case "record":
      return el("rect", { x: -0.85, y: -0.85, width: 1.7, height: 1.7, rx: 0.55, fill });
    case "delegate":
      return el("polygon", { points: "0,-1 0.95,0.7 -0.95,0.7", fill });
    default:
      return el("circle", { r: 1, fill });
  }
}

// Build the DOM once per graph. Rewriting innerHTML every frame re-lays out every label,
// which is what made the motion look like insects crawling.
function build() {
  if (isTree()) { buildTree(); return; }
  stage.textContent = "";

  const defs = el("defs", {});
  const glowFilter = el("filter", { id: "glow", x: "-80%", y: "-80%", width: "260%", height: "260%" });
  glowFilter.append(
    el("feGaussianBlur", { stdDeviation: isSkyfall() ? 7 : 4, result: "b" }),
    (() => {
      const merge = el("feMerge", {});
      merge.append(
        el("feMergeNode", { in: "b" }), el("feMergeNode", { in: "b" }), el("feMergeNode", { in: "b" }));
      return merge;
    })());
  defs.append(glowFilter);
  stage.append(defs);

  const starLayer = el("g", {});
  const glowLayer = el("g", { filter: "url(#glow)", opacity: isSkyfall() ? 1 : 0.55 });
  const edgeLayer = el("g", {});
  const flowLayer = el("g", {});
  const bubbleLayer = el("g", {});
  const nodeLayer = el("g", {});
  const labelLayer = el("g", {});
  stage.append(starLayer, bubbleLayer, glowLayer, edgeLayer, flowLayer, nodeLayer, labelLayer);

  const starDots = isSkyfall()
    ? stars.map(star => {
        const dot = el("circle", { r: star.r, fill: "currentColor" });
        starLayer.append(dot);
        return { star, dot };
      })
    : [];

  const style = getComputedStyle(document.documentElement);
  const born = (style.getPropertyValue("--born") || "#2f8f4e").trim();
  const died = (style.getPropertyValue("--died") || "#b4453f").trim();

  const gradients = new Map();
  const gradientFor = color => {
    if (!gradients.has(color)) {
      gradients.set(color, sphereGradient(defs, color, "grad" + gradients.size));
    }
    return gradients.get(color);
  };

  const heaviest = [...graph.edges].sort((l, r) => r.weight - l.weight);
  const flowing = new Set(heaviest.slice(0, FLOW_EDGES).map(edge => edge));

  const edges = graph.edges.filter(edge => !nodeById.get(edge.from)?.container).map(edge => {
    let element;
    let flow = null;

    if (isObsidian()) {
