      // Hairlines, all of them. Paint decides colour and dash each frame.
      element = el("path", { fill: "none", "stroke-linecap": "round" });
    } else if (edge.kind === KIND_CONTAINS) {
      element = el("path", {
        fill: "none", stroke: "currentColor", "stroke-dasharray": "2 6", "stroke-linecap": "round",
      });
    } else if (edge.state === "died") {
      element = el("path", { fill: "none", stroke: died, "stroke-dasharray": "4 3", "stroke-linecap": "round" });
    } else if (edge.kind === KIND_INHERIT) {
      element = el("path", {
        fill: "none", stroke: edge.state === "born" ? born : "currentColor",
        "stroke-dasharray": "1 4", "stroke-linecap": "round",
      });
    } else {
      element = el("path", { fill: edge.state === "born" ? born : colorOf(nodeById.get(edge.from)) });

      // A dotted line crawling from source to target: direction you can watch rather than infer.
      if (flowing.has(edge)) {
        flow = el("path", {
          fill: "none", "stroke-linecap": "round", "stroke-dasharray": "1 13",
          stroke: edge.state === "born" ? born : colorOf(nodeById.get(edge.from)),
        });
        flowLayer.append(flow);
      }
    }

    edgeLayer.append(element);
    return { edge, element, flow };
  });

  const nodes = graph.nodes.map(node => {
    const color = colorOf(node);
    const name = node.display || t("globalNamespace");
    const group = el("g", { class: node.container ? "node container" : node.anchor ? "node anchor" : "node" });
    group.append(node.container
      ? el("circle", { r: 1, fill: color, "fill-opacity": 0.07, stroke: color, "stroke-opacity": 0.45 })
      : node.anchor
        ? el("circle", { r: 1, fill: "none", stroke: color, "stroke-width": 0.12 })
        : isObsidian() ? el("circle", { r: 1, fill: color }) : shapeFor(node, gradientFor(color), color));
    group.dataset.id = node.id;
    group.dataset.name = encodeURIComponent(name);

    const title = document.createElementNS(SVG, "title");
    title.textContent = name
      + (node.flavor ? " · " + node.flavor : "")
      + (node.module ? " · " + node.module : "");
    group.append(title);
    (node.container ? bubbleLayer : nodeLayer).append(group);

    const halo = el("circle", { r: 1, fill: color });
    glowLayer.append(halo);

    const text = shorten(name);
    const tier = tierOf(node);
    const label = el("text", {
      class: node.anchor ? "label anchor" : "label", "text-anchor": "middle",
      fill: node.hue < 0 ? "var(--muted)" : "currentColor",
      "font-weight": LABEL_WEIGHT[tier],
    });
    label.textContent = text;
    labelLayer.append(label);

    let em = 0;
    for (const ch of text) em += /[ᄀ-ᇿ　-鿿가-힯]/.test(ch) ? 1 : 0.55;

    const members = node.container
      ? graph.edges.filter(edge => edge.from === node.id).map(edge => edge.to)
      : null;

    return { node, group, label, halo, em, color, tier, members };
  });

  const focusRing = el("circle", {
    r: 1, fill: "none", stroke: "var(--accent)", "stroke-width": 2.2, "stroke-opacity": 0,
  });
  labelLayer.append(focusRing);

  dom = { starDots, glowLayer, edgeLayer, nodeLayer, labelLayer, edges, nodes, focusRing };
  renderLegendCard();
  depthKey = "";
  lastLabelPass = 0;
  visibleLabels = new Set();
}

function pickLabels(placed) {
  const mode = labelSelect.value;
  if (mode === "none") return new Set();
  if (mode === "all") return new Set(placed.map(item => item.id));

  const chosen = new Set();
  const boxes = [];

  for (const item of placed) {
    const half = item.em * item.size * 0.5;
    const box = { x1: item.x - half, x2: item.x + half, y1: item.y - item.size, y2: item.y + 3 };
    if (boxes.some(o => box.x1 < o.x2 && box.x2 > o.x1 && box.y1 < o.y2 && box.y2 > o.y1)) continue;
    boxes.push(box);
    chosen.add(item.id);
  }

  return chosen;
}

function paint() {
  if (isTree()) { paintTree(); return; }
  if (!graph || !dom) return;

  const width = stage.clientWidth, height = stage.clientHeight;
  stage.setAttribute("viewBox", `0 0 ${width} ${height}`);
  const cx = width / 2, cy = height / 2;

  const flat = isObsidian();
  const cosY = flat ? 1 : Math.cos(rotY), sinY = flat ? 0 : Math.sin(rotY);
  const cosX = flat ? 1 : Math.cos(rotX), sinX = flat ? 0 : Math.sin(rotX);

  let centre = { x: 0, y: 0 };
  if (holdsStill()) {
    // Framed once, to the box the picture actually makes from this angle, and kept while
    // the reader turns it - re-framing every frame would make it breathe.
    if (!framing || framing.width !== width || framing.height !== height) {
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      for (const node of graph.nodes) {
        const x1 = node.x * cosY - node.z * sinY;
        const z1 = node.x * sinY + node.z * cosY;
        const y2 = node.y * cosX - z1 * sinX;
        minX = Math.min(minX, x1); maxX = Math.max(maxX, x1);
        minY = Math.min(minY, y2); maxY = Math.max(maxY, y2);
      }
      framing = {
        width, height,
        // Bubbles reach past the nodes they hold, and their names sit above them - leave room.
        fit: Math.min(
          (width * (opened() ? 0.72 : 0.84)) / Math.max(1, maxX - minX),
          (height * (opened() ? 0.66 : 0.76)) / Math.max(1, maxY - minY)),
        centre: { x: (minX + maxX) / 2, y: (minY + maxY) / 2 },
      };
    }
    fit = framing.fit;
    centre = framing.centre;
  } else {
    const spread = Math.max(1, ...graph.nodes
      .filter(node => !node.anchor)
      .map(node => Math.hypot(node.x, node.y, node.z)));
    fit = (Math.min(width, height) * 0.46) / spread;
  }
  const t0 = flight ? flight.eased : 1;
  const alive = !flat && !flight && !reducedMotion()
    && graph.nodes.length <= ALIVE_NODES && graph.edges.length <= ALIVE_EDGES;

  const project = flat
    ? (px, py) => ({
        x: cx + panX + (px - centre.x) * fit * zoom,
        y: cy + panY + (py - centre.y) * fit * zoom,
        z: 0, s: 1,
      })
    : (px, py, pz) => {
    const x1 = px * cosY - pz * sinY;
    const z1 = px * sinY + pz * cosY;
    const y2 = py * cosX - z1 * sinX;
    const z2 = py * sinX + z1 * cosX;
    const X = (x1 - centre.x) * fit, Y = (y2 - centre.y) * fit, Z = z2 * fit;
    const scale = 700 / (700 + Z);
    return { x: cx + X * scale * zoom, y: cy + Y * scale * zoom, z: Z, s: scale };
  };

  for (const { star, dot } of dom.starDots) {
    const point = project(star.x, star.y, star.z);
    // On a wide screen the fit grows, and a star can end up behind the camera - its scale goes
    // negative, and so would its radius. It is not in view; draw nothing.
    if (point.s <= 0) { dot.setAttribute("r", "0"); continue; }
    dot.setAttribute("cx", point.x.toFixed(1));
    dot.setAttribute("cy", point.y.toFixed(1));
    dot.setAttribute("r", (star.r * point.s).toFixed(2));
    dot.setAttribute("fill-opacity", (0.05 + 0.16 * point.s).toFixed(3));
  }

  const screen = new Map();
  for (const node of graph.nodes) {
    let px = flight ? node.fx + (node.x - node.fx) * t0 : node.x;
    let py = flight ? node.fy + (node.y - node.fy) * t0 : node.y;
    let pz = flight ? node.fz + (node.z - node.fz) * t0 : node.z;

    if (alive) {
      const angle = drift * DRIFT_SPEED + node.phase;
      px += Math.cos(angle) * node.amp;
      py += Math.sin(angle) * node.amp * 0.62;
      pz += Math.sin(angle) * node.amp * 0.78;
    }

    screen.set(node.id, project(px, py, pz));
  }

  const degree = new Map();
  for (const edge of graph.edges) {
    degree.set(edge.from, (degree.get(edge.from) || 0) + edge.weight);
    degree.set(edge.to, (degree.get(edge.to) || 0) + edge.weight);
  }

  const heaviestNode = Math.max(1, ...degree.values());
  const heaviestEdge = Math.max(1, ...graph.edges.map(edge => edge.weight), 1);

  const neighbours = new Set();
  if (highlight !== null) {
    neighbours.add(highlight);
    for (const edge of graph.edges) {
      if (edge.from === highlight) neighbours.add(edge.to);
      if (edge.to === highlight) neighbours.add(edge.from);
    }
  }

  for (const { edge, element, flow } of dom.edges) {
    const a = screen.get(edge.from), b = screen.get(edge.to);
    if (!a || !b) continue;
    if (legendHidesEdge(edge)) {
      element.setAttribute("display", "none");
      flow?.setAttribute("display", "none");
      continue;
    }
    element.removeAttribute("display");
    flow?.removeAttribute("display");

    const touched = highlight === null || edge.from === highlight || edge.to === highlight;
    const depth = (a.s + b.s) / 2;
    const share = Math.log1p(edge.weight) / Math.log1p(heaviestEdge);
    // Wiring among our own code is the story; a line out to a library is a footnote.
    const theirs = nodeById.get(edge.from)?.hue < 0 || nodeById.get(edge.to)?.hue < 0 ? 0.5 : 1;
    const base = (isSkyfall() ? 0.30 + 0.55 * share : 0.14 + 0.5 * share) * theirs;
    const opacity = ((highlight === null ? base : touched ? 0.92 : 0.05) * depth).toFixed(3);

    if (flat) {
      const lit = highlight !== null && touched;
      element.setAttribute("d", `M${a.x.toFixed(1)} ${a.y.toFixed(1)} L${b.x.toFixed(1)} ${b.y.toFixed(1)}`);
      element.setAttribute("stroke",
        edge.state === "born" ? "var(--born)" : edge.state === "died" ? "var(--died)"
          : lit ? "var(--accent)" : "var(--edge)");
      element.setAttribute("stroke-dasharray",
        edge.kind === KIND_INHERIT || edge.kind === KIND_CONTAINS || edge.state === "died" ? "3 3" : "none");
      element.setAttribute("stroke-width",
        ((edge.kind === KIND_CONTAINS ? 0.6 : 0.7 + 1.1 * share) * Math.min(2, Math.sqrt(zoom))).toFixed(2));
      element.setAttribute("stroke-opacity", (highlight === null
        ? (edge.kind === KIND_CONTAINS ? 0.25 : (0.32 + 0.4 * share) * theirs)
        : lit ? 0.95 : 0.05).toFixed(3));
      continue;
    }

    // Links bow away from the straight line. Parallel arcs read as separate strands
    // where parallel straight lines merge into one grey smear.
    const dx = b.x - a.x, dy = b.y - a.y;
    const length = Math.max(0.01, Math.hypot(dx, dy));
    const nx = -dy / length, ny = dx / length;
    const bow = Math.min(34, length * 0.13);
    const mx = (a.x + b.x) / 2 + nx * bow;
    const my = (a.y + b.y) / 2 + ny * bow;

    if (edge.kind === KIND_CONTAINS) {
      element.setAttribute("d", `M${a.x.toFixed(1)} ${a.y.toFixed(1)} L${b.x.toFixed(1)} ${b.y.toFixed(1)}`);
      element.setAttribute("stroke-width", (0.9 * depth).toFixed(2));
      element.setAttribute("stroke-opacity", ((highlight === null ? 0.22 : touched ? 0.6 : 0.04) * depth).toFixed(3));
      continue;
    }

    if (edge.kind === KIND_INHERIT || edge.state === "died") {
      element.setAttribute("d", `M${a.x.toFixed(1)} ${a.y.toFixed(1)} Q${mx.toFixed(1)} ${my.toFixed(1)} ${b.x.toFixed(1)} ${b.y.toFixed(1)}`);
      element.setAttribute("stroke-width", ((edge.state === "died" ? 1.5 : 1.1) * depth).toFixed(2));
      element.setAttribute("stroke-opacity", edge.state === "same" ? opacity : Math.max(0.55, +opacity).toFixed(3));
      continue;
    }

    const wide = (0.9 + 3.4 * share) * depth;
    const narrow = 0.3 * depth;

    element.setAttribute("d",
      `M${(a.x + nx * wide).toFixed(1)} ${(a.y + ny * wide).toFixed(1)}` +
      ` Q${(mx + nx * wide * 0.5).toFixed(1)} ${(my + ny * wide * 0.5).toFixed(1)}` +
      ` ${(b.x + nx * narrow).toFixed(1)} ${(b.y + ny * narrow).toFixed(1)}` +
      ` L${(b.x - nx * narrow).toFixed(1)} ${(b.y - ny * narrow).toFixed(1)}` +
      ` Q${(mx - nx * wide * 0.5).toFixed(1)} ${(my - ny * wide * 0.5).toFixed(1)}` +
      ` ${(a.x - nx * wide).toFixed(1)} ${(a.y - ny * wide).toFixed(1)} Z`);
    element.setAttribute("fill-opacity",
      edge.state === "born" ? Math.max(0.6, +opacity).toFixed(3) : opacity);

    if (flow) {
      flow.setAttribute("d", `M${a.x.toFixed(1)} ${a.y.toFixed(1)} Q${mx.toFixed(1)} ${my.toFixed(1)} ${b.x.toFixed(1)} ${b.y.toFixed(1)}`);
      flow.setAttribute("stroke-width", (1.6 * depth).toFixed(2));
      flow.setAttribute("stroke-opacity", ((touched ? 0.85 : 0.1) * depth).toFixed(3));
      flow.setAttribute("stroke-dashoffset", reducedMotion() ? "0" : (-drift * 0.011).toFixed(1));
    }
  }

  const candidates = [];

  for (const item of dom.nodes) {
    const { node, group, halo } = item;

    // Switched off in the legend: gone from view, but still where it was.
    item.off = legendHides(node);
    if (item.off) {
      group.setAttribute("display", "none");
      halo?.setAttribute("fill-opacity", "0");
      item.point = screen.get(node.id);
      item.radius = 0;
      item.dim = 0;
      item.near = false;
      item.size = LABEL_SIZE[0];
      continue;
    }
    if (!node.container) group.removeAttribute("display");

    // Ring and Layers keep their own geometry, which does not keep a module in one place.
    // A bubble there would be drawn round half the screen; colour carries membership instead.
    if (node.container && FIXED_ANGLE.has(style)) {
      group.setAttribute("display", "none");
      halo.setAttribute("fill-opacity", "0");
      item.point = screen.get(node.id);
      item.radius = 0;
      item.dim = 0;
      item.near = false;
      item.size = LABEL_SIZE[0];
      continue;
    }
    if (node.container) group.removeAttribute("display");

    // A bubble is drawn round what it holds, wherever that ended up on screen.
    if (node.container) {
      const points = item.members.map(id => screen.get(id)).filter(Boolean);
      const own = screen.get(node.id);
      const cx0 = points.length ? points.reduce((sum, p) => sum + p.x, 0) / points.length : own.x;
      const cy0 = points.length ? points.reduce((sum, p) => sum + p.y, 0) / points.length : own.y;
      const reach = Math.max(0, ...points.map(p => Math.hypot(p.x - cx0, p.y - cy0)));
      const radius = Math.max(24, reach + 22);
      const lit = highlight === null || neighbours.has(node.id);

      group.setAttribute("transform", `translate(${cx0.toFixed(1)} ${cy0.toFixed(1)}) scale(${radius.toFixed(1)})`);
      group.firstChild.setAttribute("stroke-width", (1.3 / radius).toFixed(4));
      group.firstChild.setAttribute("fill-opacity", (highlight === node.id ? 0.14 : lit ? 0.07 : 0.03).toFixed(2));
      group.firstChild.setAttribute("stroke-opacity", (lit ? 0.5 : 0.18).toFixed(2));
      halo.setAttribute("fill-opacity", "0");

      item.point = { x: cx0, y: cy0, z: own.z, s: 1 };
      item.radius = radius;
      item.dim = lit ? 1 : 0.35;
      item.near = true;
      item.size = LABEL_SIZE[0];
      candidates.push({
        id: node.id, x: cx0, y: cy0 - radius - 5, size: item.size, em: item.em, weight: Infinity,
      });
      continue;
    }

    const point = screen.get(node.id);
    const share = node.anchor ? 0 : Math.sqrt((degree.get(node.id) || 1) / heaviestNode);
    // Other people's code is drawn a size smaller: it is there to show what ours leans on.
    const own = node.hue >= 0 ? 1 : 0.78;
    const radius = flat
      ? (node.anchor ? 22 : (3.5 + 11 * share) * own) * Math.min(2.5, zoom)
      : (node.anchor ? 26 : (5 + 18 * share) * own) * point.s * Math.min(2, zoom);
    const near = highlight === null || neighbours.has(node.id);
    const dim = near ? 1 : 0.18;

    group.setAttribute("transform",
      `translate(${point.x.toFixed(2)} ${point.y.toFixed(2)}) scale(${radius.toFixed(2)})`);

    const shape = group.firstChild;
    const solid = ((0.62 + 0.36 * point.s) * dim * (node.hue < 0 ? 0.7 : node.outside ? 0.75 : 1)).toFixed(2);

    if (node.anchor) {
      shape.setAttribute("stroke-width", (1.6 / radius).toFixed(3));
      shape.setAttribute("stroke-opacity", (0.75 * dim).toFixed(2));
    } else if (node.flavor === "interface") {
      shape.setAttribute("stroke-opacity", solid);
    } else {
      shape.setAttribute("fill-opacity", solid);
      if (node.id === highlight) {
        shape.setAttribute("stroke", "currentColor");
        shape.setAttribute("stroke-width", (1.8 / radius).toFixed(3));
        shape.setAttribute("stroke-opacity", "0.6");
      } else {
        shape.removeAttribute("stroke");
      }
    }

    // Only the heaviest few get a halo. Glow on everything is both slow and mush.
    // Obsidian lights what you point at in its accent and leaves the rest as they are.
    if (flat && !node.anchor) shape.setAttribute("fill", node.id === highlight ? "var(--accent)" : item.color);

    // Only the top few of ours glow. Glow on everything is both slow and mush.
    const glowing = !flat && !node.anchor && ((node.hue >= 0 && node.rank < 3) || node.id === highlight);
    halo.setAttribute("cx", point.x.toFixed(1));
    halo.setAttribute("cy", point.y.toFixed(1));
    halo.setAttribute("r", (radius * 0.92).toFixed(1));
    halo.setAttribute("fill-opacity", glowing ? (0.62 * point.s * dim).toFixed(2) : "0");

    item.point = point;
    item.radius = radius;
    item.dim = dim;
    item.near = near;
    // The tier sets the size; depth only nudges it. Letting depth decide made whatever sat
    // nearest the camera the loudest thing on screen.
    item.size = flat ? [13, 11.5, 10.5][item.tier] : LABEL_SIZE[item.tier] * (0.9 + 0.1 * point.s);

    // In Obsidian, quieter names wait until you zoom in. Pointing at something names it
    // and its neighbours regardless.
    const zoomedEnough = !flat || labelSelect.value !== "auto" || zoom >= LABEL_ZOOM[item.tier];
    if (near && zoomedEnough) {
      candidates.push({
        id: node.id, x: point.x, y: flat ? point.y + radius + 12 : point.y - radius - 5,
        size: item.size, em: item.em,
        // Named in order of importance, so when two would overlap the one that matters wins.
        // What you went inside is always named - it answers "where am I".
        weight: node.anchor ? Infinity : -node.rank,
      });
    }
  }

  const now = performance.now();
  if (now - lastLabelPass > LABEL_PASS_MS || flight || dragging) {
    lastLabelPass = now;
    candidates.sort((l, r) => r.weight - l.weight);
    visibleLabels = pickLabels(candidates);
  }

  for (const item of dom.nodes) {
    const { node, label, point, radius, dim, near } = item;
    const shown = !item.off && ((near && (visibleLabels.has(node.id) || node.id === highlight)) || node.id === focus
      || (flat && highlight !== null && neighbours.has(node.id)));
    // Whole pixels. Text on fractional positions re-rasterises as it moves and shimmers.
    // Obsidian puts the name under the dot; bubbles keep theirs on top.
    label.setAttribute("x", Math.round(point.x));
    label.setAttribute("y", Math.round(flat && !node.container ? point.y + radius + 12 : point.y - radius - 5));
    label.setAttribute("font-size", item.size.toFixed(1));
    label.setAttribute("fill-opacity", shown ? (point.s * 0.95 * dim).toFixed(2) : "0");
  }

  // The ring round what a search found. It breathes, so the eye finds it on a busy map.
  const found = focus === null ? null : dom.nodes.find(item => item.node.id === focus && item.point);
  if (found) {
    const pulse = reducedMotion() ? 8 : 7 + 3 * Math.sin(performance.now() / 260);
    dom.focusRing.setAttribute("cx", found.point.x.toFixed(1));
    dom.focusRing.setAttribute("cy", found.point.y.toFixed(1));
    dom.focusRing.setAttribute("r", (found.radius + pulse).toFixed(1));
    dom.focusRing.setAttribute("stroke-opacity", "0.9");
  } else {
    dom.focusRing.setAttribute("stroke-opacity", "0");
  }

  // Painter's algorithm, but only touch the DOM when the order actually changed.
  const sorted = dom.nodes.filter(item => !item.node.container).sort((l, r) => r.point.z - l.point.z);
  const key = sorted.map(item => item.node.id).join(",");
  if (key !== depthKey) {
    depthKey = key;
    for (const item of sorted) dom.nodeLayer.append(item.group);
  }
}

// Going inside, what is in there bursts out of the thing you clicked (spread 0.04: from a
// point). Coming out is the same film backwards: you land beside the thing you left, and the
// level around it gathers in from wider than it will sit (spread 1.3), the way a view does
// when you step back from it.
function flyFrom(origin, spread = 0.04) {
  for (const node of graph.nodes) {
    node.fx = origin.x + (node.x - origin.x) * spread;
    node.fy = origin.y + (node.y - origin.y) * spread;
    node.fz = origin.z + (node.z - origin.z) * spread;
  }
  flight = { start: performance.now(), eased: 0 };
}

// With less motion asked for, nothing flies: the new level fades in instead, so it still
// reads as a change rather than a jump cut.
function fadeIn() {
  stage.animate?.([{ opacity: 0 }, { opacity: 1 }], { duration: 140, easing: "ease-out" });
}

function drawCrumbs() {
  crumbs.innerHTML = trail.map((step, i) =>
    i === trail.length - 1
      ? `<b>${step.label ?? t("all")}</b>`
      : `<button data-step="${i}">${step.label ?? t("all")}</button><span>›</span>`).join("");
  upButton.disabled = trail.length < 2;
}

const escapeHtml = text => String(text ?? "").replace(/[&<>"]/g, ch =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[ch]);

// A member's line in the panel. A C# declaration carries the name ("private int App._count"),
// so it is shown as it is. scip-python writes only the type in that place ("builtins.int"), and
// showing that alone would list a column of types with no names - so the name leads, and the
// type follows, quieter. The name is matched as a whole word: a field "i" is not found in "int".
function memberLine(m) {
  const name = m.display, signature = m.signature;
  if (!signature) return `<code>${escapeHtml(name)}</code>`;
  const escaped = name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const word = new RegExp(`(^|[^\\w])${escaped}([^\\w]|$)`);
  if (word.test(signature)) return `<code>${escapeHtml(signature)}</code>`;
  return `<code>${escapeHtml(name)}</code> <span class="type">${escapeHtml(signature)}</span>`;
}

// A doc comment as the server hands it: plain text with `code`, **bold** and blank-line
// paragraphs. It is escaped first, so nothing in a comment can become markup.
function docHtml(text) {
  return escapeHtml(text)
    .replace(/`([^`\n]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
}

// What the thing is, said the way the tree and the legend say it: the same mark and colour, the
// kind by name, and the modifiers its declaration carries - so an abstract method reads as one.
// Modifiers are read only from the words before the name's parameters or body, where C# and
// Python put them; a word inside a name or a type is not taken for one.
const KIND_CODE = { Package: 10, Namespace: 2, Type: 3, Method: 4, Term: 5 };
const MODIFIERS = ["abstract", "static", "async", "virtual", "override", "sealed", "readonly", "const"];

function modifiersOf(signature) {
  if (!signature) return [];
  const words = new Set(signature.split(/[({=:]/)[0].split(/\s+/));
  return MODIFIERS.filter(word => words.has(word));
}

function kindLine(d) {
  const kind = treeKind({ kind: KIND_CODE[d.kind] ?? 0, flavor: d.flavor, shape: d.shape });
  const chips = modifiersOf(d.signature).map(word => `<span class="chip">${t("mod_" + word)}</span>`).join("");
  return `<div class="kindline">${treeMarkSvg(kind, kindColour(kind))}` +
    `<span class="kind">${escapeHtml(TREE_KIND_NAME()[kind] ?? d.kind)}</span>${chips}</div>`;
}

// The graph shows how things are wired. This shows what the thing is.
let openDetail = null;

async function showDetail(id) {
  openDetail = id;
  if (panel.hidden || !panel.firstElementChild) {
    panel.innerHTML = `<p class="none">${t("loading")}</p>`;
  } else {
    panel.classList.add("stale");
  }
  panel.hidden = false;
  panel.setAttribute("aria-busy", "true");

  const response = await fetch(api("/api/symbol?id=" + id)).catch(() => null);
  // Clicked on to something else, or closed, while this was on its way.
  if (openDetail !== id) return;
  panel.classList.remove("stale");
  panel.removeAttribute("aria-busy");
  if (!response?.ok) { panel.innerHTML = `<p class="none">${t("loadFailed")}</p>`; return; }

  const d = await response.json();
  if (openDetail !== id) return;
  const shapes = {
    property: t("property"), method: t("method"), field: t("field"), event: t("event"),
    type: t("nestedType"), namespace: t("namespaces"), module: t("modules"), member: t("member"),
  };

  const list = (items, render) => items.length
    ? "<ul>" + items.map(render).join("") + "</ul>"
    : `<p class="none">${t("none")}</p>`;

  const typeLink = item =>
    `<li><button type="button" class="link" data-id="${item.id}">${escapeHtml(item.display)}</button>` +
    (item.module && item.module !== d.module ? ` <span class="meta">${escapeHtml(item.module)}</span>` : "") +
    (item.weight > 1 ? ` <span class="meta">${item.weight.toLocaleString()}</span>` : "") + "</li>";

  const grouped = {};
  for (const member of d.members) (grouped[member.shape] ||= []).push(member);

  const section = (title, body) => `<h3>${title}</h3>${body}`;

  panel.innerHTML =
    `<button id="panelClose">${t("close")}</button>` +
    `<h2>${escapeHtml(d.display)}</h2>` +
    kindLine(d) +
    (d.module || d.namespace
      ? `<div class="meta">${[d.module, d.namespace].filter(Boolean).map(escapeHtml).join(" · ")}</div>` : "") +
    (d.signature ? `<code class="sig">${escapeHtml(d.signature)}</code>` : "") +
    (d.doc ? `<div class="doc folded" id="panelDoc">${docHtml(d.doc)}</div>` +
      `<button type="button" class="docToggle" id="panelDocToggle" aria-controls="panelDoc" aria-expanded="false" hidden>${t("docMore")}</button>` : "") +
    (d.file ? `<div class="meta">${escapeHtml(d.file)}${d.line != null ? " : " + (d.line + 1) : ""}</div>` : "") +
    Object.entries(grouped).map(([shape, items]) =>
      section(`${shapes[shape] || shape} ${items.length}`,
        list(items, m => `<li>${memberLine(m)}` +
          (m.summary ? `<div class="summary" title="${escapeHtml(m.summary)}">${docHtml(m.summary)}</div>` : "") +
          `</li>`))).join("") +
    section(t("injects"), list(d.injects, typeLink)) +
    section(t("injectedInto"), list(d.injectedInto, typeLink)) +
    (d.implements.length ? section(t("implementsLabel"), list(d.implements, typeLink)) : "") +
    (d.implementedBy.length ? section(t("implementedBy"), list(d.implementedBy, typeLink)) : "") +
    section(t("callers"), list(d.callers, typeLink)) +
    section(t("calls"), list(d.calls, typeLink));

  // Offer "show more" only when the fold actually hides something.
  const doc = document.getElementById("panelDoc");
  const toggle = document.getElementById("panelDocToggle");
  if (doc && toggle) {
    toggle.hidden = doc.scrollHeight <= doc.clientHeight + 1;
    toggle.onclick = () => {
      const open = doc.classList.toggle("folded") === false;
      toggle.setAttribute("aria-expanded", String(open));
      toggle.textContent = t(open ? "docLess" : "docMore");
    };
  }

  document.getElementById("panelClose").onclick = () => {
    panel.hidden = true;
    openDetail = null;
    highlight = null;
    paint();
  };
}

panel.addEventListener("click", event => {
  const link = event.target.closest("[data-id]");
  if (!link) return;
  const id = Number(link.dataset.id);
  if (nodeById.has(id)) { highlight = id; paint(); }
  showDetail(id);
});

async function loadSnapshots() {
  let snapshots = [];
  try {
    const response = await fetch(api("/api/snapshots"));
    if (response.ok) snapshots = await response.json();
  } catch { /* without snapshots only the time axis is unavailable */ }

  if (snapshots.length === 0) {
    document.getElementById("timeTool").hidden = true;
    knownSnapshots = 0;
    return;
  }

  const label = snapshot => `ord ${snapshot.ord} · ${snapshot.indexedAt}`;
  atSelect.innerHTML = snapshots.map(s => `<option value="${s.ord}">${label(s)}</option>`).join("");
  atSelect.value = snapshots[snapshots.length - 1].ord;

  fromSelect.innerHTML = `<option value="">${t("compareNone")}</option>`
    + snapshots.map(s => `<option value="${s.ord}">${label(s)}</option>`).join("");

  document.getElementById("compareRow").hidden = snapshots.length < 2;
  syncTools();
}

function describeCounts() {
  const born = graph.edges.filter(edge => edge.state === "born").length;
  const died = graph.edges.filter(edge => edge.state === "died").length;

  counts.innerHTML =
    `${t("nodes")} ${graph.nodes.length.toLocaleString()} / ${graph.nodeBudget.toLocaleString()}` +
    ` · ${t("edges")} ${graph.edges.length.toLocaleString()}` +
    (graph.budgetExhausted ? ` · ${t("budgetSpent")}` : "") +
    (fromSelect.value
      ? ` · <span class="born">${t("newDeps")} ${born.toLocaleString()}</span>` +
        ` · <span class="died">${t("brokenDeps")} ${died.toLocaleString()}</span>`
      : "");

  truncatedOut.innerHTML = graph.truncated.length
    ? `<span class="warn">${t("folded")} ${graph.truncated.length}: ` +
      graph.truncated.slice(0, 2).map(item => `${item.display} +${item.hidden}`).join(", ") + "</span>"
    : "";
}

async function load(origin = null) {
  focus = null;
  syncTools();
  if (isTree()) return loadTree();
  const step = trail[trail.length - 1];
  granularitySelect.value = step.granularity;
  counts.textContent = t("loading");

  const params = new URLSearchParams({ granularity: step.granularity });
  if (scopeSelect.value === "own") params.set("own", "1");
  if (step.seed !== null) params.set("seed", step.seed);
  if (trail.length === 1 && step.granularity === "module") params.set("open", "1");
  if (atSelect.value) params.set("at", atSelect.value);
  if (fromSelect.value) params.set("from", fromSelect.value);

  const response = await fetch(api("/api/map?" + params));
  if (!response.ok) { counts.textContent = t("queryFailed"); return; }

  graph = await response.json();
  if (graph.opened) {
    openModules(graph);
    // Face the plane the modules are laid out on.
    rotX = -0.16;
    rotY = 0;
  }

  // Going inside something should not make it vanish. Keep it on screen as the thing
  // everything else sits in, tied to what it holds by faint lines.
  if (step.anchor && !graph.nodes.some(node => node.id === step.anchor.id)) {
    graph.nodes.push({ ...step.anchor, anchor: true });
    const present = new Set(graph.nodes.map(node => node.id));
    for (const child of graph.children || []) {
      if (!present.has(child) || child === step.anchor.id) continue;
      graph.edges.push({
        from: step.anchor.id, to: child, kind: KIND_CONTAINS, weight: 0, inferred: false, state: "same",
      });
    }
  }

  nodeById = new Map(graph.nodes.map(node => [node.id, node]));
  classify(graph);
  highlight = null;
  layout(graph.nodes, graph.edges);
  drawCrumbs();
  drawLegend();
  build();

  // Coming out of something: find it on this level - itself, or the bubble standing for it.
  const left = origin?.leaving == null ? null
    : graph.nodes.find(node => !node.anchor && (node.id === origin.leaving || node.target === origin.leaving));
  if (left) focus = left.id;   // the ring marks where you just were

  if (!origin || origin.instant) flight = null;
  else if (reducedMotion()) { flight = null; fadeIn(); }
  else if ("leaving" in origin) flyFrom(left ?? { x: 0, y: 0, z: 0 }, 1.3);
  else flyFrom(origin);
  paint();
  describeCounts();
}

// Clicking asks a new question rather than growing what is on screen.
// A click moves you, so the side panel follows you: it describes what you are inside, and
// on the top level - inside nothing - it gets out of the way.
function describeWhereYouAre() {
  const here = trail[trail.length - 1];
  if (here.seed !== null) {
    showDetail(here.seed);
  } else {
    panel.hidden = true;
    openDetail = null;
  }
}

// What is one level inside a thing depends on the thing, not on the screen: the opened
// first screen holds modules and namespaces side by side.
const FINER = { module: "namespace", namespace: "type" };
const nextLevelOf = node =>
  !node ? FINER[trail[trail.length - 1].granularity] ?? null
    : node.kind === SYMBOL_PACKAGE ? "namespace"
    : node.kind === SYMBOL_NAMESPACE ? "type"
    : null;
const canGoInside = node => Boolean(nextLevelOf(node));

function drillInto(group, label) {
  const id = typeof group === "string" ? Number(group) : Number(group.dataset.id);
  const name = label ?? decodeURIComponent(group.dataset.name);
  const from = nodeById.get(id);
  const next = nextLevelOf(from);
  if (!next) return;
  const origin = from ? { x: from.x, y: from.y, z: from.z } : { x: 0, y: 0, z: 0 };

  // A bubble stands for a symbol it is not itself - go inside that one.
  const seed = from?.target ?? id;
  const anchor = from
    ? { id: seed, display: from.display, kind: from.kind, module: from.module, flavor: from.flavor, own: from.own }
    : { id, display: name, kind: null, module: null, flavor: null, own: false };

  trail.push({ label: name, seed, granularity: next, anchor });
  load(origin).then(describeWhereYouAre);
}

// From the keyboard it is instant - Esc gets pressed in runs, and a flight on each would
// only make it feel slow.
function goUp({ instant = false } = {}) {
  if (trail.length < 2) return;
  const leaving = trail.pop().seed;
  load({ leaving, instant }).then(describeWhereYouAre);
}

upButton.addEventListener("click", () => goUp());
addEventListener("keydown", event => {
  const typing = event.target instanceof HTMLInputElement || event.target instanceof HTMLSelectElement;
  if ((event.key === "/" && !typing) || (event.key.toLowerCase() === "k" && (event.ctrlKey || event.metaKey))) {
    event.preventDefault();
    searchBox.focus();
    searchBox.select();
    return;
  }
  if (event.key === "Escape" && !importer.hidden) { closeImporter(); return; }
  if (event.key === "Escape" && closeMenu({ refocus: true })) return;
  if (event.key === "Escape" && !typing) goUp({ instant: true });
});

// ---- the tree -----------------------------------------------------------------------
// What is inside what: modules, namespaces, types, members, opened a branch at a time.
// The map says who calls whom; this says where things live. Pointing at a node draws its
// calls over the tree, to wherever the other end is visible right now.
const TREE_ROW = 24;
const TREE_COL = 220;
const TREE_LEFT = 36;
const TREE_TOP = 28;

const tree = { children: new Map(), more: new Map(), nodes: new Map(), open: new Set(), links: new Map() };
let treeDom = null;
let treeHovered = null;

function resetTree() {
  tree.children.clear(); tree.more.clear(); tree.nodes.clear(); tree.open.clear(); tree.links.clear();
}

async function treeFetch(parentId) {
  const key = parentId ?? "root";
  if (tree.children.has(key)) return tree.children.get(key);

  const params = new URLSearchParams();
  if (parentId != null) params.set("id", parentId);
  if (scopeSelect.value === "own") params.set("own", "1");

  let answer = { nodes: [], more: 0 };
  try {
    const response = await fetch(api("/api/tree/children?" + params));
    if (response.ok) answer = await response.json();
  } catch { /* an empty branch */ }

  for (const node of answer.nodes) { node.parent = parentId ?? null; tree.nodes.set(node.id, node); }
  tree.children.set(key, answer.nodes);
  tree.more.set(key, answer.more);
  return answer.nodes;
}

async function loadTree() {
  counts.textContent = t("loading");
  if (!tree.children.has("root")) {
    const modules = await treeFetch(null);
    // Our modules start open, so the first look already shows what is in them.
    for (const module of modules) {
      if (!module.own) continue;
      tree.open.add(module.id);
      await treeFetch(module.id);
    }
  }
  graph = null;
  drawCrumbs();
  drawLegend();
  buildTree();
  paintTree();
}

// Leaves take the next row; a parent sits in the middle of its children. That keeps the
// shape of a hierarchy chart while every name still gets a line of its own.
function layoutTree() {
  let next = 0;
  const rows = [];
  const place = (key, depth) => {
    const ys = [];
    for (const node of tree.children.get(key) || []) {
      if (treeHides(node)) continue;   // switched off in the legend, with everything under it
      const kids = tree.open.has(node.id) ? tree.children.get(node.id) || [] : [];
      let y;
      if (kids.length) {
        const span = place(node.id, depth + 1);
        y = (span[0] + span[1]) / 2;
      } else {
        y = next++ * TREE_ROW;
      }
      rows.push({ node, x: depth * TREE_COL, y, depth });
      ys.push(y);
    }
    const more = tree.more.get(key);
    if (more) {
      const y = next++ * TREE_ROW;
      rows.push({ more, x: depth * TREE_COL, y, depth, parentKey: key === "root" ? undefined : key });
      ys.push(y);
    }
    return ys.length ? [ys[0], ys[ys.length - 1]] : [next * TREE_ROW, next * TREE_ROW];
  };
  place("root", 0);
  return rows;
}

// ---- what a row in the tree is -----------------------------------------------------
// One table of marks, drawn in the tree and in its legend alike. Types keep the shapes they
// have on the map; members get a smaller family of their own, so a function and a constant
// no longer look the same.
const treeKind = node =>
  node.kind === 10 ? "module"
    : node.kind === SYMBOL_NAMESPACE ? "namespace"
    : node.kind === 3 ? (["interface", "enum", "record", "struct", "delegate"].includes(node.flavor) ? node.flavor : "class")
    : node.shape === "method" || node.kind === 4 ? "method"
    : node.shape === "property" ? "property"
    : node.shape === "event" ? "event"
    : "field";

const TREE_MARKS = {
  module: c => [["circle", { r: 6.5, fill: c, "fill-opacity": 0.22, stroke: c, "stroke-width": 1.6 }], ["circle", { r: 2.4, fill: c }]],
  namespace: c => [["circle", { r: 5.5, fill: c, "fill-opacity": 0.22, stroke: c, "stroke-width": 1.4 }]],
  class: c => [["circle", { r: 4.8, fill: c }]],
  interface: c => [["circle", { r: 4, fill: "none", stroke: c, "stroke-width": 2 }]],
  enum: c => [["polygon", { points: "0,-5.5 5.5,0 0,5.5 -5.5,0", fill: c }]],
  record: c => [["rect", { x: -4.5, y: -4.5, width: 9, height: 9, rx: 3, fill: c }]],
  struct: c => [["rect", { x: -4.5, y: -4.5, width: 9, height: 9, rx: 0.8, fill: c }]],
  delegate: c => [["polygon", { points: "0,-5 4.8,3.8 -4.8,3.8", fill: c }]],
  method: c => [["polygon", { points: "-2.6,-3.6 3.8,0 -2.6,3.6", fill: c }]],
  property: c => [["circle", { r: 2.9, fill: "none", stroke: c, "stroke-width": 1.6 }]],
  field: c => [["rect", { x: -2.8, y: -2.8, width: 5.6, height: 5.6, fill: c }]],
  event: c => [["path", { d: "M1 -4.2 L-2.4 0.6 L0.2 0.6 L-1 4.2 L2.6 -0.8 L0 -0.8 Z", fill: c }]],
};
const TREE_TOGGLES = ["class", "interface", "enum", "record", "struct", "delegate", "method", "property", "field", "event"];
const treeHides = node => TREE_TOGGLES.includes(treeKind(node)) && legendOff.has(treeKind(node));

function treeMark(node, colour) {
  const group = el("g", { class: "mark" });
  for (const [tag, attrs] of TREE_MARKS[treeKind(node)](colour)) group.append(el(tag, attrs));
  return group;
}

function treeMarkSvg(kind, colour) {
  const inner = TREE_MARKS[kind](colour)
    .map(([tag, attrs]) => `<${tag} ${Object.entries(attrs).map(([k, v]) => `${k}="${v}"`).join(" ")}/>`).join("");
  return `<svg class="swatch" viewBox="0 0 30 14" aria-hidden="true"><g transform="translate(15 7)">${inner}</g></svg>`;
}

// In the tree, where a row sits already says which module it is in, so colour is free to say
// what the row is - and it says it together with the shape. The hues are spread round the wheel
// so neighbours in the list never look alike, and follow the editor conventions developers
// know: classes orange, interfaces blue, methods purple. Structure stays neutral. There is one
// set for dark themes and a deeper one for light themes, where pale hues would wash out.
const KIND_COLOURS = {
  dark: {
    class: "#f0a04b", interface: "#5fa8ff", enum: "#e6c84f", record: "#6ccb5f", struct: "#3fc7b0",
    delegate: "#f27db0", method: "#b98cf5", property: "#56c8e8", field: "#8fa2ff", event: "#ff7a6b",
  },
  light: {
    class: "#c26a12", interface: "#2a6fd6", enum: "#9a7f00", record: "#2e8b3e", struct: "#0f8f7e",
    delegate: "#c23a7e", method: "#7e4ccb", property: "#1c86ab", field: "#4f5fd6", event: "#d0453a",
  },
};
function kindColour(kind) {
  if (kind === "module" || kind === "namespace") return "var(--muted)";
  const dark = getComputedStyle(document.documentElement).colorScheme.includes("dark");
  return KIND_COLOURS[dark ? "dark" : "light"][kind];
}

function buildTree() {
  stage.textContent = "";
  const rows = layoutTree();
  const at = new Map(rows.filter(row => row.node).map(row => [row.node.id, row]));

  const root = el("g", {});
  const wires = el("g", {});
  const overlay = el("g", {});
  const marks = el("g", {});
  root.append(wires, overlay, marks);
  stage.append(root);

  const made = [];
  for (const row of rows) {
    if (row.more) {
      const group = el("g", {});
      const text = el("text", { x: 10, y: 4, fill: "var(--muted)", "font-size": 11.5 });
      text.textContent = `… +${row.more.toLocaleString()} ${t("treeMore")}`;
      group.append(text);
      marks.append(group);
      made.push({ row, group, label: text });
      continue;
    }

    const node = row.node;
    const open = tree.open.has(node.id);
    const member = node.kind === 4 || node.kind === 5;
    const colour = kindColour(treeKind(node));
    const group = el("g", { class: "tnode", transform: `translate(${row.x} ${row.y})` });
    group.dataset.id = node.id;

    // What the row is, by its mark - the same shapes as the map and the legend. A branch that is
    // open fades its mark a little; its children say the rest.
    const mark = treeMark(node, colour);
    // Someone else's code keeps its shape and colour, faded: what it is still reads, and that it
    // is not ours reads too (its name is muted as well).
    if (!node.own) mark.setAttribute("opacity", "0.45");
    else if (open && node.childCount) mark.setAttribute("opacity", "0.6");
    group.append(mark);

    const label = el("text", {
      x: 10, y: 4, "font-size": member ? 11.5 : node.kind === 10 ? 13.5 : 12.5,
      "font-weight": node.kind === 10 ? 700 : node.kind === 3 && node.own ? 600 : 400,
      fill: node.own ? "currentColor" : "var(--muted)",
    });
    label.textContent = shorten(node.display || t("globalNamespace"));
    if (node.childCount && !open) {
      const count = document.createElementNS(SVG, "tspan");
      count.setAttribute("fill", "var(--muted)");
      count.setAttribute("font-weight", "400");
      count.textContent = "  " + node.childCount.toLocaleString();
      label.append(count);
    }
    group.append(label);

    const title = document.createElementNS(SVG, "title");
    title.textContent = [node.display, TREE_KIND_NAME()[treeKind(node)], node.module].filter(Boolean).join(" · ");
    group.append(title);
    marks.append(group);
    made.push({ row, group, label });
  }

  // Columns are as wide as their longest name, measured, so a branch leaves from the end of
  // its parent's name instead of running through it.
  const widest = [];
  for (const item of made) {
    item.width = item.label.getComputedTextLength ? item.label.getComputedTextLength() : 80;
    widest[item.row.depth] = Math.max(widest[item.row.depth] || 0, item.width);
  }
  const columnX = [0];
  for (let depth = 1; depth <= widest.length; depth++) {
    columnX[depth] = columnX[depth - 1] + (widest[depth - 1] || 0) + 64;
  }
  for (const item of made) {
    item.row.x = columnX[item.row.depth];
    item.row.end = item.row.x + 10 + item.width;
    item.group.setAttribute("transform", `translate(${item.row.x} ${item.row.y})`);
  }

  for (const item of made) {
    const parent = item.row.node ? at.get(item.row.node.parent)
      : item.row.parentKey !== undefined ? at.get(item.row.parentKey) : null;
    if (!parent) continue;
    const x1 = parent.end + 6, y1 = parent.y, x2 = item.row.x - 7, y2 = item.row.y, mid = (x1 + x2) / 2;
    wires.append(el("path", {
      d: `M${x1} ${y1} C${mid} ${y1} ${mid} ${y2} ${x2} ${y2}`,
      fill: "none", stroke: "currentColor", "stroke-opacity": 0.22, "stroke-width": 1,
    }));
  }

  const ring = el("circle", { r: 11, fill: "none", stroke: "var(--accent)", "stroke-width": 2, "stroke-opacity": 0 });
  marks.append(ring);

  treeDom = { root, overlay, at, ring, rows };
  renderLegendCard();
  counts.textContent = `${rows.filter(row => row.node).length.toLocaleString()} ${t("treeRows")}`;
  if (treeHovered !== null) drawTreeLinks(treeHovered);
}

function paintTree() {
  if (!treeDom) return;
  const width = stage.clientWidth, height = stage.clientHeight;
  stage.setAttribute("viewBox", `0 0 ${width} ${height}`);
  treeDom.root.setAttribute("transform", `translate(${TREE_LEFT + panX} ${TREE_TOP + panY}) scale(${zoom})`);

  const found = focus !== null ? treeDom.at.get(focus) : null;
  if (found) {
    treeDom.ring.setAttribute("cx", found.x);
    treeDom.ring.setAttribute("cy", found.y);
    treeDom.ring.setAttribute("r", (reducedMotion() ? 11 : 10 + 2.5 * Math.sin(performance.now() / 260)).toFixed(1));
    treeDom.ring.setAttribute("stroke-opacity", "0.9");
  } else {
    treeDom.ring.setAttribute("stroke-opacity", "0");
  }
}

async function treeClick(id) {
  const node = tree.nodes.get(id);
  if (!node) return;
  showDetail(id);
  if (!node.childCount) return;

  if (tree.open.has(id)) tree.open.delete(id);
  else { await treeFetch(id); tree.open.add(id); }
  buildTree();
  paintTree();
}

async function treeHover(id) {
  treeHovered = id;
  if (!treeDom) return;
  treeDom.overlay.textContent = "";
  for (const group of treeDom.root.querySelectorAll(".tnode")) group.removeAttribute("opacity");
  if (id === null) return;

  if (!tree.links.has(id)) {
    try {
      const response = await fetch(api("/api/tree/links?id=" + id));
      tree.links.set(id, response.ok ? await response.json() : []);
    } catch { tree.links.set(id, []); }
  }
  if (treeHovered === id) drawTreeLinks(id);
}

// Each link names a type and its chain up to its module. The line goes to the first link
// in that chain that is on screen - the type itself if its branch is open, otherwise the
// namespace or module it is folded into. Links that land on the node's own ancestors are
// containment, not calls, and are dropped.
function drawTreeLinks(id) {
  const from = treeDom.at.get(id);
  if (!from) return;

  const ancestors = new Set();
  for (let node = tree.nodes.get(id); node; node = tree.nodes.get(node.parent)) ancestors.add(node.id);

  const merged = new Map();
  for (const link of tree.links.get(id) || []) {
    const landing = link.chain.map(other => treeDom.at.get(other)).find(Boolean);
    if (!landing || ancestors.has(landing.node.id)) continue;
    const key = landing.node.id + (link.outgoing ? ">" : "<");
    const same = merged.get(key);
    if (same) same.weight += link.weight;
    else merged.set(key, { landing, weight: link.weight, outgoing: link.outgoing });
  }

  const heaviest = Math.max(1, ...[...merged.values()].map(link => link.weight));
  const lit = new Set([id]);
  for (const { landing, weight, outgoing } of merged.values()) {
    // From the end of one name to the end of the other, bowing out to the right of both,
    // so a call never runs through a name.
    const x1 = from.end + 4, y1 = from.y, x2 = landing.end + 4, y2 = landing.y;
    const reach = Math.max(x1, x2) + 50 + Math.min(220, Math.abs(y2 - y1) * 0.25);
    treeDom.overlay.append(el("path", {
      d: `M${x1} ${y1} C${reach} ${y1} ${reach} ${y2} ${x2} ${y2}`,
      fill: "none", stroke: "var(--accent)",
      "stroke-width": (0.8 + 2.4 * Math.log1p(weight) / Math.log1p(heaviest)).toFixed(2),
      "stroke-opacity": 0.75, "stroke-dasharray": outgoing ? "none" : "4 3",
    }));
    lit.add(landing.node.id);
  }

  for (const group of treeDom.root.querySelectorAll(".tnode")) {
    if (!lit.has(Number(group.dataset.id))) group.setAttribute("opacity", "0.35");
  }
}

// Open the branches down to a thing and bring it to the middle of the screen.
async function treeReveal(id) {
  let path = [];
  try {
    const response = await fetch(api("/api/tree/path?id=" + id));
    if (response.ok) path = await response.json();
  } catch { /* nowhere to go */ }

  let key = null;
  await treeFetch(null);
  for (const step of path) {
    const kids = await treeFetch(key);
    const node = kids.find(kid => kid.id === step || (kid.merged || []).includes(step));
    if (!node) continue;           // folded into the step before it
    if (node.id === id || (node.merged || []).includes(id)) { key = node.id; break; }
    tree.open.add(node.id);
    key = node.id;
  }

  const target = tree.nodes.has(id) ? id : key;
  buildTree();
  const row = target !== null ? treeDom.at.get(target) : null;
  if (row) {
    panX = stage.clientWidth / 2 - TREE_LEFT - row.x * zoom - 120;
    panY = stage.clientHeight / 2 - TREE_TOP - row.y * zoom;
  }
  focus = target;
  paintTree();
  if (target !== null) showDetail(target);
}

// ---- search ------------------------------------------------------------------------
// Type a name, pick a line, and the map takes you to where that thing lives: a type opens
// inside its namespace, a namespace inside its module, a method or property at its type.
let hits = [];
let chosen = -1;
let searchTimer = null;
let searchSeq = 0;

const kindLabel = hit =>
  hit.flavor || ({ 10: t("kindModule"), 2: t("kindNamespace"), 3: t("kindType"), 4: t("kindMethod") }[hit.kind]
    ?? t("kindMember"));

const whereLabel = hit => [
  hit.kind === 4 || hit.kind === 5 ? hit.type : null,
  hit.kind !== 2 && hit.kind !== 10 ? hit.namespace : null,
  hit.kind !== 10 ? hit.module : null,
].filter(Boolean).join(" · ");

function drawHits() {
  const typed = searchBox.value.trim() !== "";
  if (!hits.length) {
    hitList.innerHTML = typed ? `<li class="none">${t("noHits")}</li>` : "";
    hitList.hidden = !typed;
    return;
  }
  hitList.hidden = false;
  hitList.innerHTML = hits.map((hit, i) => {
    const where = whereLabel(hit);
    return `<li data-i="${i}" class="${i === chosen ? "on" : ""}${hit.own ? "" : " theirs"}">` +
      `<b>${escapeHtml(hit.display)}</b><span class="meta">${escapeHtml(kindLabel(hit))}` +
      `${where ? " · " + escapeHtml(where) : ""}</span></li>`;
  }).join("");
}

async function runSearch() {
  const query = searchBox.value.trim();
  const seq = ++searchSeq;
  if (!query) { hits = []; chosen = -1; drawHits(); return; }

  let found = [];
  try {
    const response = await fetch(api("/api/search?limit=12&q=" + encodeURIComponent(query)));
    if (response.ok) found = await response.json();
  } catch { /* a failed search is an empty one */ }

  // Answers can come back out of order while typing. Only the latest counts.
  if (seq !== searchSeq) return;
  hits = found;
  chosen = hits.length ? 0 : -1;
  drawHits();
}

async function goTo(hit) {
  hitList.hidden = true;
  searchBox.blur();
  if (isTree()) {
    if (!hit.own && scopeSelect.value === "own") {
      scopeSelect.value = "all";
      try { localStorage.setItem("treering-scope", "all"); } catch { /* fine without it */ }
      resetTree();
    }
    await treeReveal(hit.id);
    return;
  }

  // Someone else's code is not on an "our code" map. Show everything so it can be seen.
  if (!hit.own && scopeSelect.value === "own") {
    scopeSelect.value = "all";
    try { localStorage.setItem("treering-scope", "all"); } catch { /* fine without it */ }
  }

  const root = trail[0];
  const member = hit.kind !== 10 && hit.kind !== 2 && hit.kind !== 3;
  const target = member ? hit.typeId : hit.id;

  if (hit.kind === 10) {
    root.granularity = "module";
    trail = [root];
  } else if (hit.kind === 2 && hit.moduleId != null) {
    trail = [root, {
      label: hit.module, seed: hit.moduleId, granularity: "namespace",
      anchor: { id: hit.moduleId, display: hit.module, kind: SYMBOL_PACKAGE, module: hit.module, flavor: null, own: hit.own },
    }];
  } else if (hit.namespaceId != null) {
    trail = [root, {
      label: hit.namespace, seed: hit.namespaceId, granularity: "type",
      anchor: { id: hit.namespaceId, display: hit.namespace, kind: SYMBOL_NAMESPACE, module: hit.module, flavor: null, own: hit.own },
    }];
  } else {
    // Nowhere to go inside - a type in the global namespace, say. Say what it is.
    showDetail(target ?? hit.id);
    return;
  }

  // The level gathers in around what was found, the way it does round a thing you came out of.
  await load({ leaving: target });
  focus = target;
  highlight = target;
  paint();
  showDetail(target);
  if (!nodeById.has(target)) counts.textContent += " · " + t("notDrawn");
}

searchBox.addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(runSearch, 140);
});

searchBox.addEventListener("keydown", event => {
  if (event.key === "ArrowDown" || event.key === "ArrowUp") {
    event.preventDefault();
    if (!hits.length) return;
    chosen = (chosen + (event.key === "ArrowDown" ? 1 : hits.length - 1)) % hits.length;
    drawHits();
    hitList.children[chosen]?.scrollIntoView({ block: "nearest" });
  } else if (event.key === "Enter") {
    event.preventDefault();
    if (hits[chosen]) goTo(hits[chosen]);
  } else if (event.key === "Escape") {
    searchBox.value = "";
    hits = [];
    drawHits();
    searchBox.blur();
  }
});

searchBox.addEventListener("focus", () => { if (hits.length) hitList.hidden = false; });
searchBox.addEventListener("blur", () => setTimeout(() => { hitList.hidden = true; }, 150));

// mousedown, not click: a click lands after the box has blurred and the list has gone.
hitList.addEventListener("mousedown", event => {
  const row = event.target.closest("li[data-i]");
  if (!row) return;
  event.preventDefault();
  goTo(hits[Number(row.dataset.i)]);
});

crumbs.addEventListener("click", event => {
  const button = event.target.closest("button");
  if (!button) return;
  const step = Number(button.dataset.step);
  // Several levels up at once still lands beside the branch you came down.
  const leaving = trail[step + 1]?.seed ?? null;
  trail = trail.slice(0, step + 1);
  load({ leaving }).then(describeWhereYouAre);
});

granularitySelect.addEventListener("change", () => {
  trail[trail.length - 1].granularity = granularitySelect.value;
  load();
});

labelSelect.addEventListener("change", () => { lastLabelPass = 0; paint(); });
themeSelect.addEventListener("change", () => applyTheme(themeSelect.value));
langSelect.addEventListener("change", () => applyLanguage(langSelect.value));
styleSelect.addEventListener("change", () => applyStyle(styleSelect.value));
scopeSelect.addEventListener("change", () => {
  try { localStorage.setItem("treering-scope", scopeSelect.value); } catch { /* fine without it */ }
  resetTree();
  // 범위가 바뀌면 노드 집합이 통째로 달라진다. 들어와 있던 자리는 그대로 두고 다시 묻는다.
  load();
});
atSelect.addEventListener("change", () => load());
fromSelect.addEventListener("change", () => load());

// ---- the bar's tools ----------------------------------------------------------------
// The selects are still the source of truth - they are in the menus, and on a narrow screen
// they are the only way in. The icons and the switch on the bar only drive them.
const shapeButtons = [...document.querySelectorAll("#shapes [data-shape]")];
const ownToggle = document.getElementById("ownToggle");

// Called from load() and applyStyle(), which can run before this part of the script has -
// so it looks its elements up rather than use the constants below.
function syncTools() {
  for (const button of document.querySelectorAll("#shapes [data-shape]")) {
    const on = button.dataset.shape === style;
    button.setAttribute("aria-checked", String(on));
    button.tabIndex = on ? 0 : -1;
  }
  document.getElementById("ownToggle").setAttribute("aria-pressed", String(scopeSelect.value === "own"));

  // "ord 3 · 2026-09-25 14:46" says more than the bar has room for; the day and time are enough.
  const short = option => (option?.textContent ?? "").replace(/^ord \d+ · \d{4}-/, "");
  const at = short(atSelect.selectedOptions[0]);
  const from = fromSelect.value ? short(fromSelect.selectedOptions[0]) : null;
  document.getElementById("timeLabel").textContent = from ? `${from} → ${at}` : at;
}

for (const button of shapeButtons) {
  button.addEventListener("click", () => applyStyle(button.dataset.shape));
}
// A radio group moves with the arrow keys, and Tab lands only on the one that is on.
document.getElementById("shapes").addEventListener("keydown", event => {
  const step = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[event.key];
  if (!step) return;
  event.preventDefault();
  const at = shapeButtons.findIndex(button => button.dataset.shape === style);
  const next = shapeButtons[(at + step + shapeButtons.length) % shapeButtons.length];
  applyStyle(next.dataset.shape);
  next.focus();
});

ownToggle.addEventListener("click", () => {
  scopeSelect.value = scopeSelect.value === "own" ? "all" : "own";
  scopeSelect.dispatchEvent(new Event("change"));
  syncTools();
});

// Menus: one open at a time; a click elsewhere or Esc closes it, and focus goes back.
const pops = [...document.querySelectorAll(".pop")];
function setMenu(pop, open) {
  const button = pop.querySelector("button[aria-controls]");
  const menu = pop.querySelector(".menu");
  menu.hidden = !open;
  button.setAttribute("aria-expanded", String(open));
  if (open) menu.querySelector("select:not([hidden])")?.focus();
}
function openMenu() { return pops.find(pop => !pop.querySelector(".menu").hidden) ?? null; }
function closeMenu({ refocus = false } = {}) {
  const pop = openMenu();
  if (!pop) return false;
  setMenu(pop, false);
  if (refocus) pop.querySelector("button[aria-controls]").focus();
  return true;
}
for (const pop of pops) {
  pop.querySelector("button[aria-controls]").addEventListener("click", () => {
    const opening = pop.querySelector(".menu").hidden;
    closeMenu();
    if (opening) setMenu(pop, true);
  });
}
document.addEventListener("pointerdown", event => { if (!event.target.closest(".pop")) closeMenu(); });

stage.addEventListener("pointerdown", event => {
  if (isTree()) {
    dragging = { x: event.clientX, y: event.clientY, startX: event.clientX, startY: event.clientY,
      row: event.target.closest(".tnode"), right: event.button === 2 };
    stage.setPointerCapture(event.pointerId);
    return;
  }
  dragging = {
    x: event.clientX, y: event.clientY,
    startX: event.clientX, startY: event.clientY,
    group: event.target.closest(".node"),
    // The right button only ever means "go inside". It does not turn the camera.
    right: event.button === 2,
  };

  // Obsidian: a node you press can be dragged, and it pulls what it is tied to, like rope.
  // Only when stretched - pushing a node into its neighbours leaves them where they are.
  if (isObsidian() && dragging.group && !dragging.right) {
    const node = nodeById.get(Number(dragging.group.dataset.id));
    if (node && !node.container && !node.anchor) {
      dragging.node = node;
      dragging.ropes = graph.edges
        .filter(edge => edge.kind !== KIND_CONTAINS && (edge.from === node.id || edge.to === node.id))
        .map(edge => nodeById.get(edge.from === node.id ? edge.to : edge.from))
        .filter(other => other && other !== node && !other.anchor && !other.container)
        .map(other => ({ other, rest: Math.hypot(other.x - node.x, other.y - node.y) }));
    }
  }
  stage.classList.add("dragging");
  stage.setPointerCapture(event.pointerId);
});

stage.addEventListener("pointermove", event => {
  if (isTree()) {
    if (!dragging || dragging.right) return;
    panX += event.clientX - dragging.x;
    panY += event.clientY - dragging.y;
    dragging.x = event.clientX;
    dragging.y = event.clientY;
    paintTree();
    return;
  }
  if (!dragging || dragging.right) return;

  if (isObsidian()) {
    const dx = event.clientX - dragging.x, dy = event.clientY - dragging.y;
    dragging.x = event.clientX;
    dragging.y = event.clientY;
    const far = Math.hypot(event.clientX - dragging.startX, event.clientY - dragging.startY) >= 4;

    if (dragging.node) {
      if (!far) return;   // still a click, until it moves
      const scale = fit * zoom;
      const node = dragging.node;
      node.x += dx / scale;
      node.y += dy / scale;
      for (const rope of dragging.ropes) {
        const ox = node.x - rope.other.x, oy = node.y - rope.other.y;
        const d = Math.max(0.01, Math.hypot(ox, oy));
        const stretch = d - rope.rest;
        if (stretch > 0) {
          rope.other.x += (ox / d) * stretch * 0.12;
          rope.other.y += (oy / d) * stretch * 0.12;
        }
      }
    } else {
      panX += dx;
      panY += dy;
    }
    paint();
    return;
  }

  rotY += (event.clientX - dragging.x) * 0.006;
  rotX += (event.clientY - dragging.y) * 0.006;
  rotX = Math.max(-1.4, Math.min(1.4, rotX));
  dragging.x = event.clientX;
  dragging.y = event.clientY;
  paint();
});

stage.addEventListener("pointerup", event => {
  if (isTree()) {
    if (!dragging) return;
    const moved = Math.hypot(event.clientX - dragging.startX, event.clientY - dragging.startY);
    const { row, right } = dragging;
    dragging = null;
    if (moved < 4 && row && !right) treeClick(Number(row.dataset.id));
    return;
  }
  if (!dragging) return;
  const moved = Math.hypot(event.clientX - dragging.startX, event.clientY - dragging.startY);
  const { group, right } = dragging;
  dragging = null;
  stage.classList.remove("dragging");
  // Capturing the pointer for rotation redirects the click to the canvas, so the node is
  // remembered on pointerdown and treated as a click only if the pointer barely moved.
  // A drag is a turn of the camera, never a click - so letting go after turning the map
  // on empty space does not throw you up a level.
  if (moved >= 4) return;

  // The right button is the one that moves you. On a node it goes in; on empty space, or
  // on the ring of what you are already inside, it comes back out.
  const id = group ? Number(group.dataset.id) : null;
  const here = trail[trail.length - 1];

  // Empty space takes you out. So does the right button on the ring of where you are.
  if (id === null || (right && id === here.seed)) {
    goUp();
    return;
  }

  // A click on a node takes you inside it. Where there is no further in - the type level,
  // or the ring of what you are already inside - it says what the thing is instead.
  if (id !== here.seed && canGoInside(nodeById.get(id))) {
    drillInto(group);
  } else {
    highlight = id;
    paint();
    showDetail(id);
  }
});

// The browser menu would cover the node you just asked to open.
stage.addEventListener("contextmenu", event => event.preventDefault());

stage.addEventListener("pointerover", event => {
  if (isTree()) {
    if (dragging) return;
    const row = event.target.closest(".tnode");
    treeHover(row ? Number(row.dataset.id) : null);
    return;
  }
  if (dragging) return;
  const group = event.target.closest(".node");
  const id = group ? Number(group.dataset.id) : null;
  if (id === highlight) return;
  highlight = id;
  paint();
});

stage.addEventListener("pointerleave", () => {
  if (isTree()) { treeHover(null); return; }
  if (highlight === null) return;
  highlight = null;
  paint();
});

stage.addEventListener("wheel", event => {
  event.preventDefault();

  // A tree is read like a page: the wheel scrolls it, Ctrl+wheel zooms about the pointer.
  if (isTree()) {
    if (event.ctrlKey || event.metaKey) {
      const before = zoom;
      zoom = Math.max(0.3, Math.min(3, zoom * (event.deltaY < 0 ? 1.12 : 0.89)));
      const box = stage.getBoundingClientRect();
      const sx = event.clientX - box.left - TREE_LEFT, sy = event.clientY - box.top - TREE_TOP;
      panX = sx - (sx - panX) * (zoom / before);
      panY = sy - (sy - panY) * (zoom / before);
    } else {
      panX -= event.deltaX;
      panY -= event.deltaY;
    }
    paintTree();
    return;
  }

  const before = zoom;
  zoom = Math.max(0.25, Math.min(isObsidian() ? 8 : 4, zoom * (event.deltaY < 0 ? 1.12 : 0.89)));

  // Flat views zoom about the pointer, so what you are looking at stays under it.
  if (isObsidian()) {
    const box = stage.getBoundingClientRect();
    const sx = event.clientX - box.left - stage.clientWidth / 2;
    const sy = event.clientY - box.top - stage.clientHeight / 2;
    panX = sx - (sx - panX) * (zoom / before);
    panY = sy - (sy - panY) * (zoom / before);
  }
  paint();
}, { passive: false });

addEventListener("resize", paint);

function beat(now) {
  if (!graph) return;

  if (flight) {
    const progress = Math.min(1, (now - flight.start) / FLIGHT_MS);
    flight.eased = 1 - Math.pow(1 - progress, 5);
    paint();
    if (progress >= 1) flight = null;
    return;
  }

  drift = now;
  if (!dragging && graph.nodes.length <= ALIVE_NODES && !holdsStill() && !reducedMotion()) rotY += SPIN_SPEED * 16;
  paint();
}

// requestAnimationFrame is the right driver - it pauses with the tab. But it never fires on
// surfaces that do not composite, where the map would silently freeze, so fall back to a timer.
let sawFrame = false;

function heartbeat(now) {
  sawFrame = true;
  requestAnimationFrame(heartbeat);
  beat(now);
}

requestAnimationFrame(heartbeat);
setTimeout(() => {
  if (sawFrame) return;
  setInterval(() => { if (!document.hidden) beat(performance.now()); }, 32);
}, 1200);

let savedLang = null;
let savedTheme = "auto";
let savedStyle = "constellation";
let savedScope = "all";
try {
  savedLang = localStorage.getItem("treering-lang");
  savedTheme = localStorage.getItem("treering-theme") || "auto";
  savedStyle = localStorage.getItem("treering-style") || "constellation";
  savedScope = localStorage.getItem("treering-scope") || "all";
} catch { /* fine without it */ }

// English is the default, deliberately. The browser's language is not consulted -
// a public tool should open the same way for everyone, and Korean is one click away.
applyLanguage(savedLang || "en");
applyTheme(savedTheme);
// No graph yet, so this only settles the control; the first load lays out with it.
applyStyle(savedStyle);
scopeSelect.value = savedScope;

// ---- projects and import ------------------------------------------------------------
// Started as `treering serve` with no DB, the server holds every imported project. The page
// picks one, and can import another from its folder - the indexers run on the server and the
// page watches the log.
async function loadProjects() {
  let answer = { single: true, projects: [] };
  try {
    const response = await fetch("/api/projects");
    if (response.ok) answer = await response.json();
  } catch { /* an old server: one DB */ }

  if (answer.single) return true;

  // No folder window on this machine: the path field is the form.
  if (!answer.canPick) {
    importer.classList.add("no-pick");
    byPath.open = true;
  }

  projectBox.hidden = false;
  if (!currentProject && answer.projects.length) currentProject = answer.projects[0].id;
  projectSelect.innerHTML = answer.projects.map(project =>
    `<option value="${escapeHtml(project.id)}" title="${escapeHtml(project.repo)}">` +
    `${escapeHtml(project.name)}${project.languages.length ? " · " + escapeHtml(project.languages.join("+")) : ""}</option>`)
    .join("") + `<option value="__import">${t("importOption")}</option>`;
  projectSelect.value = currentProject ?? "__import";

  if (!answer.projects.length) {
    // The first screen is the import itself - not a dialog over an empty map.
    document.body.classList.add("empty");
    importer.removeAttribute("aria-modal");
    importer.setAttribute("role", "region");
    importer.setAttribute("aria-labelledby", "importTitle");
    drawRings();
    openImporter();
    return false;
  }
  return true;
}

// A cross-section of a trunk: the rings are uneven, the way a year's growth is, and the pith
// sits a little off centre. The outermost ring - now - is the accent. Seeded, so it is the
// same drawing every time.
function drawRings() {
  const svg = document.getElementById("rings");
  let seed = 7;
  const random = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const widths = [7, 10, 15, 6, 11, 18, 8, 5, 13, 9, 14];
  const phaseA = random() * Math.PI * 2, phaseB = random() * Math.PI * 2;
  let radius = 6, markup = "";
  widths.forEach((width, i) => {
    radius += width;
    // Every ring follows the one inside it, with a little of its own year in it.
    const wobble = 0.028 + random() * 0.012;
    const points = [];
    for (let k = 0; k < 96; k++) {
      const a = (k / 96) * Math.PI * 2;
      const r = radius * (1 + wobble * Math.sin(2 * a + phaseA + i * 0.08) + 0.012 * Math.sin(5 * a + phaseB + i * 0.2));
      // The pith is off centre: the rings are wider on one side.
      points.push([(r * Math.cos(a) + radius * 0.13).toFixed(1), (r * Math.sin(a) - radius * 0.05).toFixed(1)]);
    }
    const d = "M" + points.map(p => p.join(",")).join("L") + "Z";
    const last = i === widths.length - 1;
    markup += `<path d="${d}" style="--i:${i}"${last ? ' class="bark"' : ""}/>`;
  });
  svg.innerHTML = `<circle r="2.5" cx="0" cy="0"/>` + markup;
}

// The log, with the line it is on now standing out from what it has already done.
// ---- the import form ------------------------------------------------------------------
// One form, four states - idle, picking, running, failed - kept on the element as data-state,
// so the styles decide what shows. The server reports each indexer as a step with a state
// and, when it stops, a reason code; the words for that reason are chosen here, in the
// page's language, and always say what to do next.
const STEP_ICON = {
  waiting: '<circle cx="8" cy="8" r="2.5"/>',
  running: '<circle cx="8" cy="8" r="5.5" stroke-opacity="0.25"/><path d="M8 2.5a5.5 5.5 0 0 1 5.5 5.5"/>',
  done: '<path d="M3.5 8.5l3 3 6-7"/>',
  skipped: '<path d="M4.5 8h7"/>',
  failed: '<path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/>',
};
const icon = body => `<svg class="icon" viewBox="0 0 16 16" aria-hidden="true">${body}</svg>`;
const count = n => new Intl.NumberFormat(lang === "ko" ? "ko-KR" : "en-US").format(n);
const seconds = s => new Intl.NumberFormat(lang === "ko" ? "ko-KR" : "en-US", { maximumFractionDigits: 1 }).format(s);

function setImportState(state) {
  importer.dataset.state = state;
  importPick.disabled = state === "picking";
  importPickLabel.textContent = t(state === "picking" ? "importPicking" : "importPick");
}

// 1:05, 12:40 - elapsed time as a clock reads it.
const clock = secondsIn => {
  const s = Math.max(0, Math.round(secondsIn));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
};

function stepRow(step) {
  const elapsed = step.startedAt ? (Date.now() - step.startedAt) / 1000 : 0;
  const state = {
    waiting: t("stepWaiting"), skipped: t("stepSkipped"), failed: t("stepFailed"),
    running: t("stepElapsed")(clock(elapsed), step.expectedSeconds ? clock(step.expectedSeconds) : null),
    done: t("stepDone")(seconds(step.seconds), count(step.symbols)),
  }[step.state] ?? step.state;
  const why = step.reason === "not-installed" ? t("whyNotInstalled")(step.indexer)
    : step.reason === "indexer-failed" ? t("whyIndexerFailed")(step.indexer)
    : null;
  const row = document.createElement("li");
  row.className = step.state;
  row.innerHTML =
    icon(STEP_ICON[step.state] ?? STEP_ICON.waiting) +
    `<span class="lang">${escapeHtml(step.language)}</span>` +
    `<span class="name" title="${escapeHtml(step.name)}">${escapeHtml(step.name)}</span>` +
    `<span class="state">${escapeHtml(state)}</span>` +
    (why ? `<p class="why">${escapeHtml(why)}${step.detail ? `<code>${escapeHtml(step.detail)}</code>` : ""}</p>` : "") +
    (step.state === "running" ? liveBar(step, elapsed) : "");
  return row;
}

// Filled against the last time this step took, never quite to the end - it is an estimate, and
// a bar at 100% that keeps going reads as stuck. Without a last time, a travelling band.
function liveBar(step, elapsed) {
  const known = step.expectedSeconds > 0;
  const share = known ? Math.min(95, (elapsed / step.expectedSeconds) * 100) : 0;
  return `<div class="live"><div class="bar${known ? "" : " unknown"}"><span${known ? ` style="width:${share.toFixed(1)}%"` : ""}></span></div>` +
    `<span class="phase" title="${escapeHtml(step.phase || "")}">${escapeHtml(step.phase || t("stepRunning"))}</span></div>`;
}

function showProblem(text) {
  importProblem.hidden = text === null;
  if (text !== null) {
    importProblem.innerHTML = icon(STEP_ICON.failed) +
      `<div><b>${t("problemTitle")}</b>${text ? `<span>${escapeHtml(text)}</span>` : ""}</div>`;
  }
}

function showImport(status, error = null) {
  const repo = status.repo ?? importPath.value.trim();
  document.getElementById("importName").textContent = repo.split(/[\\/]/).filter(Boolean).pop() ?? repo;
  document.getElementById("importRepo").textContent = repo;
  document.getElementById("importRepo").title = repo;
  importSteps.replaceChildren(...(status.steps ?? []).map(stepRow));
  importLog.textContent = (status.log ?? []).join("\n");
  importLog.scrollTop = importLog.scrollHeight;
  document.getElementById("importDetails").hidden = !(status.log ?? []).length;

  const failed = error !== null || (!status.running && !status.ok);
  setImportState(failed ? "failed" : "running");
  showProblem(!failed ? null
    // With steps listed, each one already says why it stopped - the headline is enough.
    : error ?? ((status.steps ?? []).length ? "" : t("problemNothing")));
  if (failed) document.getElementById("importAgain").focus();
}

// The folder window is the server's: a browser never tells a page the full path of a folder
// picked in it. Choosing is the decision, so the import starts as soon as a folder comes back.
async function pickFolder() {
  setImportState("picking");
  let path = null, failed = false;
  try {
    const response = await fetch("/api/pick-folder", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ title: t("importTitle") }),
    });
    if (response.ok) path = (await response.json()).path;
    else failed = true;
  } catch { failed = true; }

  setImportState("idle");
  // No window could be opened: the path field is the way in, so open it.
  if (failed) { byPath.open = true; importPath.focus(); return; }
  if (!path) { importPick.focus(); return; }

  importPath.value = path;
  startImport();
}

let focusBeforeImporter = null;

function openImporter() {
  focusBeforeImporter = document.activeElement;
  importer.hidden = false;
  setImportState("idle");
  (importer.classList.contains("no-pick") ? importPath : importPick).focus();
  // An import started earlier may still be running - pick it up rather than start another.
  pollImport(true);
}

function closeImporter() {
  if (!document.body.classList.contains("empty")) importer.hidden = true;
  if (currentProject) projectSelect.value = currentProject;
  if (importer.hidden) focusBeforeImporter?.focus?.();
}

async function startImport() {
  const path = importPath.value.trim();
  if (!path) { byPath.open = true; importPath.focus(); return; }

  showImport({ repo: path, running: true, steps: [], log: [] });
  let response;
  try {
    response = await fetch("/api/import", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ path }),
    });
  } catch { response = null; }

  if (!response || !response.ok) {
    const problem = !response ? t("problemOther")
      : response.status === 409 ? t("problemBusy")
      : response.status === 400 ? t("problemNoFolder")
      : t("problemOther");
    showImport({ repo: path, running: false, steps: [], log: [] }, problem);
    return;
  }
  pollImport(false);
}

async function pollImport(quiet) {
  let status;
  try { status = await (await fetch("/api/import")).json(); } catch { return; }
  if (quiet && !status.running) return;
  if (importer.hidden) return;

  showImport(status);
  if (status.running) { setTimeout(() => pollImport(false), 600); return; }
  if (status.ok && status.project) location.search = "?project=" + encodeURIComponent(status.project);
}

projectSelect.addEventListener("change", () => {
  if (projectSelect.value === "__import") { openImporter(); return; }
  location.search = "?project=" + encodeURIComponent(projectSelect.value);
});
importGo.addEventListener("click", startImport);
importPick.addEventListener("click", pickFolder);
document.getElementById("importAgain").addEventListener("click", pickFolder);
document.getElementById("importClose").addEventListener("click", closeImporter);
importPath.addEventListener("keydown", event => { if (event.key === "Enter") startImport(); });

// A dialog keeps the keyboard inside it: Tab from the last control comes back to the first.
importer.addEventListener("keydown", event => {
  if (event.key !== "Tab" || document.body.classList.contains("empty")) return;
  const stops = [...importer.querySelectorAll("button, input, summary")]
    .filter(el => !el.disabled && el.getClientRects().length > 0);
  if (!stops.length) return;
  const first = stops[0], last = stops[stops.length - 1];
  if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
  else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
});

// Deal module colours once, biggest of ours first, before any view is drawn - so a module is
// the same colour whichever view happens to open first.
async function seedModuleColours() {
  try {
    const response = await fetch(api("/api/tree/children"));
    if (!response.ok) return;
    for (const module of (await response.json()).nodes) if (module.own) hueForModule(module.display);
  } catch { /* colours are then dealt as modules are met */ }
}

loadProjects().then(ready => ready && loadSnapshots().then(seedModuleColours).then(() => load()));

// ---- work behind the page -------------------------------------------------------------
// An import keeps going when its dialog is closed, and the server re-indexes on its own. The
// footer says so, with the time it has taken: a click opens the import, and once it is done,
// the imported project.
const work = document.getElementById("work");
let lastImport = null;

async function showWork() {
  let job = null, watch = null;
  try {
    const [a, b] = await Promise.all([fetch("/api/import"), fetch("/api/watch")]);
    job = a.ok ? await a.json() : null;
    watch = b.ok ? await b.json() : null;
  } catch { return; }

  const name = repo => (repo || "").split(/[\\/]/).filter(Boolean).pop() || repo;
  const running = job?.running ? job.steps?.find(step => step.state === "running") : null;
  let text = null, kind = "busy";

  if (job?.running) {
    const since = running?.startedAt ?? Date.now();
    text = t("workImport")(name(job.repo), clock((Date.now() - since) / 1000));
  } else if (job && lastImport?.running && job.ok !== null) {
    // It just finished while we were watching.
    kind = job.ok ? "done" : "failed";
    text = job.ok ? t("workImportDone")(name(job.repo)) : t("workImportFailed");
    if (job.ok) loadProjects();
  } else if (work.dataset.kind === "done" || work.dataset.kind === "failed") {
    return;   // keep the result up until it is clicked
  } else if (watch?.busy && watch.currentSince) {
    kind = "idle";
    text = t("workWatch")(watch.current, clock((Date.now() - watch.currentSince) / 1000));
  }

  lastImport = job;
  work.hidden = !text;
  if (!text) return;
  work.className = kind;
  work.dataset.kind = kind;
  work.dataset.project = job?.project || "";
  work.innerHTML = `<span class="dot" aria-hidden="true"></span>${escapeHtml(text)}`;
}

work.addEventListener("click", () => {
  const kind = work.dataset.kind;
  if (kind === "idle") return;
  if (kind === "done" && work.dataset.project) {
    location.search = "?project=" + encodeURIComponent(work.dataset.project);
    return;
  }
  work.dataset.kind = "";
  work.hidden = true;
  openImporter();
});

showWork();
setInterval(() => { if (!document.hidden) showWork(); }, 2000);

// ---- keeping current ----------------------------------------------------------------
// The server re-indexes imported projects on its own (every 10 minutes by default). The page
// notices the snapshots that brings: if you are looking at the latest, it moves to the new
// one; if you went back in time, you stay there and only the list grows.
let knownSnapshots = null;

async function followSnapshots() {
  let snapshots;
  try {
    const response = await fetch(api("/api/snapshots"));
    if (!response.ok) return;
    snapshots = await response.json();
  } catch { return; }

  const count = snapshots.length;
  if (knownSnapshots === null) { knownSnapshots = count; return; }
  if (count <= knownSnapshots) return;
  knownSnapshots = count;

  const onLatest = atSelect.options.length === 0 || atSelect.selectedIndex === atSelect.options.length - 1;
  const at = atSelect.value, from = fromSelect.value;
  document.getElementById("timeTool").hidden = false;
  await loadSnapshots();
  if (!onLatest) atSelect.value = at;
  fromSelect.value = from;
  syncTools();
  if (onLatest) {
    if (isTree()) resetTree();
    load();
  }
}

const autoUpdate = document.getElementById("autoUpdate");
async function showWatch(status) {
  if (!status) {
    try {
      const response = await fetch("/api/watch");
      if (!response.ok) return;
      status = await response.json();
    } catch { return; }
  }
  document.getElementById("autoUpdateRow").hidden = false;
  autoUpdate.checked = status.on;
  document.getElementById("autoUpdateNote").textContent = status.on
    ? t("autoUpdateEvery")(status.minutes) + (status.busy ? t("autoUpdateNow") : status.lastRound ? t("autoUpdateLast")(status.lastRound) : "")
    : t("autoUpdateOff");
}

autoUpdate.addEventListener("change", async () => {
  try {
    const response = await fetch("/api/watch", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ on: autoUpdate.checked }),
    });
    showWatch(response.ok ? await response.json() : null);
  } catch { showWatch(); }
});

showWatch();
followSnapshots();
// A tab in the background does not ask; the moment it is looked at again, it catches up
// rather than wait out the rest of the half-minute.
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  followSnapshots();
  showWatch();
});
setInterval(() => {
  if (document.hidden) return;
  followSnapshots();
  showWatch();
}, 30_000);
</script>
</body>
