# Builds Treering for Windows and Linux. A version tag (v1.2.3) publishes the builds as a GitHub
# release anyone can download. Run by hand, it only builds the branch - or, given a tag that has
# no release yet, builds that tag's code and publishes it (the tags made before this workflow).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag to build and publish (leave empty to only build the branch)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # The tests are written against Windows paths in places; they run where the tool is used most.
      - name: Test
        if: matrix.rid == 'win-x64'
        run: |
          dotnet test tests/Treering.Core.Tests -c Release
          dotnet test tests/Treering.Cli.Tests -c Release

      - name: Publish
        run: >
          dotnet publish src/Treering.Cli -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o out

      - name: Package (Windows)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item out/Treering.Cli.exe dist/treering.exe
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md dist/
          Compress-Archive -Path dist/* -DestinationPath treering-win-x64.zip

      - name: Package (Linux)
        if: matrix.rid == 'linux-x64'
        run: |
          mkdir dist
          cp out/Treering.Cli dist/treering
          chmod +x dist/treering
          cp LICENSE THIRD-PARTY-NOTICES.md dist/
          tar -czf treering-linux-x64.tar.gz -C dist .

      # The Linux build is not tested above, so it is started for real: the server comes up and
      # the page answers. A build that has the sample project also makes it and draws it - older
      # tags, published afterwards, came before the sample.
      - name: Smoke test (Linux)
        if: matrix.rid == 'linux-x64'
        run: |
          export TREERING_HOME="$RUNNER_TEMP/home"
          sample=no
          if ./dist/treering sample; then sample=yes; fi
          ./dist/treering serve --no-watch --port 7390 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:7390/api/projects > /dev/null && break; sleep 1; done
          curl -fs http://127.0.0.1:7390/ | grep -q 'Treering'
          if [ "$sample" = yes ]; then
            curl -fs http://127.0.0.1:7390/api/blueprint | grep -q 'Acme.Shop'
            curl -fs "http://127.0.0.1:7390/api/blueprint?die=1" | grep -q '"lines"'
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: treering-${{ matrix.rid }}.*
          if-no-files-found: error

  # MCP bundles (.mcpb): the same executable with a manifest, so an agent host can install
  # Treering as an MCP server in one step. One per platform, made from the builds above.
  bundle:
    needs: build
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: builds
          merge-multiple: true

      - name: Bundle
        run: |
          case "$TAG" in v*) version="${TAG#v}" ;; *) version="0.0.0-dev" ;; esac
          for rid in win-x64 linux-x64; do
            dir="mcpb-$rid"; mkdir -p "$dir/server"
            if [ "$rid" = win-x64 ]; then
              unzip -q builds/treering-win-x64.zip -d "$dir/unpacked"; exe=treering.exe; platform=win32
            else
              mkdir -p "$dir/unpacked"; tar -xzf builds/treering-linux-x64.tar.gz -C "$dir/unpacked"; exe=treering; platform=linux
            fi
            mv "$dir/unpacked/$exe" "$dir/server/$exe"; chmod +x "$dir/server/$exe"
            mv "$dir/unpacked/LICENSE" "$dir/unpacked/THIRD-PARTY-NOTICES.md" "$dir/"; rm -rf "$dir/unpacked"
            jq -n --arg version "$version" --arg exe "server/$exe" --arg platform "$platform" '{
              manifest_version: "0.3",
              name: "treering",
              display_name: "Treering",
              version: $version,
              description: "A local map of your codebase over time: symbols, callers, subgraphs and how the structure changed.",
              long_description: "Treering indexes a repository (C#, TypeScript, JavaScript, Python) and keeps a snapshot of its structure for every update. These tools answer from those snapshots: find a symbol, the types that call one, the subgraph around a point, and the dependencies that appeared or went away between two snapshots. Everything runs on your machine. Import a repository first with `treering`, or add the sample with `treering sample`.",
              author: { name: "Redhole Technologies" },
              repository: { type: "git", url: "https://github.com/RedholeTechnologies/Treering" },
              homepage: "https://github.com/RedholeTechnologies/Treering",
              license: "Apache-2.0",
              server: { type: "binary", entry_point: $exe, mcp_config: { command: ("${__dirname}/" + $exe), args: ["mcp"] } },
              tools: [
                { name: "list_projects", description: "The repositories imported into Treering." },
                { name: "find_symbol", description: "Find a symbol by name." },
                { name: "callers_of", description: "The types that call a type." },
                { name: "subgraph", description: "The subgraph around one point, within a budget." },
                { name: "changed_since", description: "Dependencies that appeared or went away between two snapshots." },
                { name: "snapshots", description: "The snapshots on file." }
              ],
              compatibility: { platforms: [$platform] }
            }' > "$dir/manifest.json"
            (cd "$dir" && zip -qr "../treering-$rid.mcpb" .)
          done
          ls -la *.mcpb

      - uses: actions/upload-artifact@v4
        with:
          name: mcpb
          path: treering-*.mcpb
          if-no-files-found: error

  release:
    needs: [build, bundle]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Checksums
        run: cd assets && sha256sum treering-* > SHA256SUMS

      # The release notes are the tag's own message - the release merge that made it. Only the
      # highest version is marked latest, so publishing an old tag late does not take its place.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force --tags
          highest="$(git tag -l 'v*' --sort=-v:refname | head -n 1)"
          latest=false
          if [ "$TAG" = "$highest" ]; then latest=true; fi
          gh release create "$TAG" assets/* --title "$TAG" --notes-from-tag --verify-tag --latest="$latest"

  # The official MCP Registry lists the release's bundles under io.github.RedholeTechnologies.
  # It trusts this workflow through GitHub's OIDC token - no password or key is stored. Only a new
  # version tag is published; tags published late (by hand) are not, and nor is a branch build.
  registry:
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mcpb
          path: mcpb

      - name: server.json
        run: |
          base="https://github.com/${{ github.repository }}/releases/download/$TAG"
          win="$(sha256sum mcpb/treering-win-x64.mcpb | cut -d' ' -f1)"
          linux="$(sha256sum mcpb/treering-linux-x64.mcpb | cut -d' ' -f1)"
          jq -n --arg version "${TAG#v}" --arg base "$base" --arg win "$win" --arg linux "$linux" '{
            "$schema": "https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json",
            name: "io.github.RedholeTechnologies/treering",
            title: "Treering",
            description: "A local map of your codebase over time: symbols, callers, subgraphs and structural change.",
            repository: { url: "https://github.com/RedholeTechnologies/Treering", source: "github" },
            version: $version,
            packages: [
              { registryType: "mcpb", identifier: ($base + "/treering-win-x64.mcpb"), fileSha256: $win, transport: { type: "stdio" } },
              { registryType: "mcpb", identifier: ($base + "/treering-linux-x64.mcpb"), fileSha256: $linux, transport: { type: "stdio" } }
            ]
          }' > server.json
          cat server.json

      - name: Publish
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
